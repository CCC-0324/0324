        R.pevgBuf = mkBuf(N * 16, B.STORAGE);

        R.cellCountBuf = mkBuf((NUM_CELLS + 1) * 4, B.STORAGE);
        R.cellStartBuf = mkBuf((NUM_CELLS + 1) * 4, B.STORAGE);
        R.pcellBuf = mkBuf(N * 4, B.STORAGE);
        R.localSlotBuf = mkBuf(N * 4, B.STORAGE);
        R.sortedBuf = mkBuf(N * 16, B.STORAGE);
        R.pushBuf = mkBuf(N * 8, B.STORAGE);
        R.stagingBuf = mkBuf(N * 16, B.MAP_READ | B.COPY_DST);

        R.bgClear = bg(pClear, [simBuf, R.cellCountBuf]);
        R.bgScan = bg(pScan, [simBuf, R.cellCountBuf, R.cellStartBuf]);
        R.bgBlast = bg(pBlast, [simBuf, R.sortedBuf, R.cellStartBuf, R.pevcBuf, R.pevgBuf, eventsBuf, R.pushBuf, constsBuf]);
        R.bgCount = []; R.bgFlags = []; R.bgScatter = []; R.bgReduce = []; R.bgForce = []; R.bgRender = [];
        for (let par = 0; par < 2; par++) {
          const sIn = R.stateBuf[par], sOut = R.stateBuf[par ^ 1];
          R.bgCount[par] = bg(pCount, [simBuf, sIn, R.pevcBuf, eventsBuf, R.cellCountBuf, R.pcellBuf, R.localSlotBuf, R.pushBuf]);
          R.bgFlags[par] = bg(pFlags, [simBuf, sIn, ripplesSimBuf, R.attrBuf]);
          R.bgScatter[par] = bg(pScatter, [simBuf, R.pcellBuf, R.localSlotBuf, R.cellStartBuf, sIn, R.attrBuf, R.sortedBuf]);
          R.bgReduce[par] = bg(pReduce, [simBuf, sIn, R.pevcBuf, eventsBuf]);
          R.bgForce[par] = bg(pForce, [simBuf, sIn, sOut, R.pevcBuf, R.pevgBuf, R.sortedBuf, R.cellStartBuf, eventsBuf, constsBuf, dmBuf, R.pushBuf]);
          R.bgRender[par] = device.createBindGroup({
            layout: renderBGL,
            entries: [
              { binding: 0, resource: { buffer: rpBuf } },
              { binding: 1, resource: { buffer: sIn } },
              { binding: 2, resource: { buffer: R.drawOrderBuf } },
              { binding: 3, resource: { buffer: R.attrBuf } },
              { binding: 4, resource: { buffer: R.clusteredBuf } },
              { binding: 5, resource: { buffer: colorsBuf } },
              { binding: 6, resource: { buffer: ripplesRenderBuf } },
              { binding: 7, resource: { buffer: dmBuf } },
              { binding: 8, resource: { buffer: sOut } },   // 此 parity 下的「上一步」
            ]
          });
        }

        R.msaaTex = device.createTexture({
          size: [canvas.width, canvas.height], sampleCount: SAMPLES, format,
          usage: GPUTextureUsage.RENDER_ATTACHMENT
        });
        R.msaaView = R.msaaTex.createView();

        groups = Math.ceil(N / WG);
        eventSlots.fill(null);
        lastReadbackRequest = -Infinity;
        rpCpu[0] = CANVAS_WIDTH; rpCpu[1] = CANVAS_HEIGHT;
        device.popErrorScope().then(err => { if (err) console.error('WebGPU rebuild 驗證錯誤:', err.message); });
      }

      // resize 前把最新的 pos/vel 讀回 CPU（模擬已暫停，不會與每步的讀回衝突）
      async function snapshot() {
        if (readbackPromise) { try { await readbackPromise; } catch (e) {} }
        const enc = device.createCommandEncoder();
        enc.copyBufferToBuffer(R.stateBuf[parity], 0, R.stagingBuf, 0, N * 16);
        device.queue.submit([enc.finish()]);
        await R.stagingBuf.mapAsync(GPUMapMode.READ);
        const data = new Float32Array(R.stagingBuf.getMappedRange());
        for (let i = 0; i < N; i++) {
          posX[i] = data[i * 4]; posY[i] = data[i * 4 + 1];
          velX[i] = data[i * 4 + 2]; velY[i] = data[i * 4 + 3];
        }
        R.stagingBuf.unmap();
      }

      function triggerCollapse(members) {
        const L = members.length;
        for (let m = 0; m < L; m++) if (pEvent[members[m]]) return;
        let slot = -1;
        for (let s = 0; s < MAX_EVENTS; s++) if (!eventSlots[s]) { slot = s; break; }
        if (slot < 0) { console.warn('事件槽已滿，略過此次坍縮'); return; }
        const ev = { members, phase: 1, frame: 0, slot };
        eventSlots[slot] = ev;
        bangEvents.push(ev);
        for (let m = 0; m < L; m++) {
          const i = members[m];
          pEvent[i] = 1;
          pevcCpu[i * 2] = 1;
          pevcCpu[i * 2 + 1] = slot;
        }
        pevcDirty = true;
      }

      function advanceEvents(now) {
        for (let e = bangEvents.length - 1; e >= 0; e--) {
          const ev = bangEvents[e];
          const mem = ev.members, L = mem.length;
          ev.frame++;
          if (ev.phase === 1) {
            if (ev.frame >= COLLAPSE_FRAMES) {
              ev.phase = 2; ev.frame = 0;
              for (let k = 0; k < L; k++) { pEvent[mem[k]] = 2; pevcCpu[mem[k] * 2] = 2; }
              pevcDirty = true;
              onBigBang(now);
            }
          } else if (ev.frame >= EXPLODE_FRAMES) {
            for (let k = 0; k < L; k++) {
              const i = mem[k];
              pEvent[i] = 0; pevcCpu[i * 2] = 0; pevcCpu[i * 2 + 1] = -1;
            }
            pevcDirty = true;
            eventSlots[ev.slot] = null;
            bangEvents.splice(e, 1);
          }
        }
      }

      let blastActive = false;
      function uploadPerStep(now) {
        blastActive = false;
        for (const ev of bangEvents) if (ev.phase === 2) { blastActive = true; break; }
        eventsCpu.fill(0);
        for (const ev of bangEvents) {
          eventsCpu[ev.slot * 8] = ev.phase;
          eventsCpu[ev.slot * 8 + 1] = ev.frame;
        }
        device.queue.writeBuffer(eventsBuf, 0, eventsCpu);
        if (pevcDirty) { device.queue.writeBuffer(R.pevcBuf, 0, pevcCpu); pevcDirty = false; }

        constsCpu.set(INTERACTION_MATRIX, 0);
        device.queue.writeBuffer(constsBuf, 0, constsCpu);

        const nr = Math.min(ripples.length, MAX_RIPPLES);
        for (let k = 0; k < nr; k++) {
          const r = ripples[k];
          ripplesCpu[k * 4] = r.x; ripplesCpu[k * 4 + 1] = r.y;
          ripplesCpu[k * 4 + 2] = r.radius * r.radius; ripplesCpu[k * 4 + 3] = 0;
        }
        if (nr > 0) device.queue.writeBuffer(ripplesSimBuf, 0, ripplesCpu, 0, nr * 4);

        let nd = 0;
        for (let i = darkMatterParticles.length - 1; i >= 0; i--) {
          const dmp = darkMatterParticles[i];
          dmp.move(now);
          if (dmp.repulsion > 0 && nd < MAX_DM) {
            dmCpu[nd * 4] = dmp.x; dmCpu[nd * 4 + 1] = dmp.y; dmCpu[nd * 4 + 2] = dmp.repulsion; dmCpu[nd * 4 + 3] = 0;
            nd++;
          }
        }
        if (nd > 0) device.queue.writeBuffer(dmBuf, 0, dmCpu, 0, nd * 4);

        simU32[0] = N; simU32[1] = stepCounter; simU32[2] = nr; simU32[3] = nd;
        simF32[4] = CANVAS_WIDTH; simF32[5] = CANVAS_HEIGHT;
        simU32[6] = GRID_WIDTH; simU32[7] = GRID_HEIGHT; simU32[8] = NUM_CELLS;
        simU32[9] = blastActive ? 1 : 0;
        device.queue.writeBuffer(simBuf, 0, simRaw);
      }

      function step(now) {
        latestNow = now;
        updateInteractionMatrix(now);
        updatePalette(now);
        uploadPerStep(now);

        const enc = device.createCommandEncoder();
        const pass = enc.beginComputePass();
        pass.setPipeline(pClear);   pass.setBindGroup(0, R.bgClear);           pass.dispatchWorkgroups(Math.ceil((NUM_CELLS + 1) / WG));
        pass.setPipeline(pCount);   pass.setBindGroup(0, R.bgCount[parity]);   pass.dispatchWorkgroups(groups);
        pass.setPipeline(pScan);    pass.setBindGroup(0, R.bgScan);            pass.dispatchWorkgroups(1);
        pass.setPipeline(pFlags);   pass.setBindGroup(0, R.bgFlags[parity]);   pass.dispatchWorkgroups(groups);
        pass.setPipeline(pScatter); pass.setBindGroup(0, R.bgScatter[parity]); pass.dispatchWorkgroups(groups);
        pass.setPipeline(pReduce);  pass.setBindGroup(0, R.bgReduce[parity]); pass.dispatchWorkgroups(groups);
        if (blastActive) { pass.setPipeline(pBlast); pass.setBindGroup(0, R.bgBlast); pass.dispatchWorkgroups(groups); }
        pass.setPipeline(pForce);   pass.setBindGroup(0, R.bgForce[parity]);  pass.dispatchWorkgroups(groups);
        pass.end();
        parity ^= 1;

        let doReadback = false;
        if (!readbackPromise && now - lastReadbackRequest >= CLUSTER_CHECK_INTERVAL) {
          enc.copyBufferToBuffer(R.stateBuf[parity], 0, R.stagingBuf, 0, N * 16);
          doReadback = true;
          lastReadbackRequest = now;
        }
        device.queue.submit([enc.finish()]);
        stepCounter++;

        if (doReadback) {
          const staging = R.stagingBuf, n = N;
          readbackPromise = staging.mapAsync(GPUMapMode.READ).then(() => {
            readbackPromise = null;
            if (staging !== R.stagingBuf) { staging.unmap(); return; }   // resize 途中的舊讀回，丟棄
            onReadback(staging, n);
          }, err => {
            readbackPromise = null;
            console.error('mapAsync 失敗:', err);
          });
        }

        advanceEvents(now);
        for (let i = darkMatterParticles.length - 1; i >= 0; i--) {
          if (darkMatterParticles[i].isExpired(now)) darkMatterParticles.splice(i, 1);
        }
        emitAndAdvanceRipples(now);
      }

      function onReadback(staging, n) {
        const data = new Float32Array(staging.getMappedRange());
        for (let i = 0; i < n; i++) {
          posX[i] = data[i * 4];
          posY[i] = data[i * 4 + 1];
        }
        staging.unmap();

        rebuildGrid();
        const clusters = updateClusters();
        applyClusters(clusters, latestNow);
        for (let i = 0; i < N; i++) clusteredU32[i] = pClustered[i];
        device.queue.writeBuffer(R.clusteredBuf, 0, clusteredU32);
      }

      function render(now, alpha) {
        if (colorsDirty) {
          for (let t = 0; t < TYPES; t++) {
            const c = COLOR_RGB[t];
            colorsCpu[t * 4] = c.r / 255; colorsCpu[t * 4 + 1] = c.g / 255; colorsCpu[t * 4 + 2] = c.b / 255; colorsCpu[t * 4 + 3] = 1;
          }
          device.queue.writeBuffer(colorsBuf, 0, colorsCpu);
          colorsDirty = false;
        }
        const blink = 0.5 + 0.5 * Math.sin(PI2 * now / 1000);
        rpCpu[2] = 0.3 + 0.2 * blink;
        rpCpu[3] = alpha;
        device.queue.writeBuffer(rpBuf, 0, rpCpu);

        renderRippleCount = Math.min(ripples.length, MAX_RIPPLES);
        for (let k = 0; k < renderRippleCount; k++) {
          const r = ripples[k];
          ripplesCpu[k * 4] = r.x; ripplesCpu[k * 4 + 1] = r.y;
          ripplesCpu[k * 4 + 2] = r.radius; ripplesCpu[k * 4 + 3] = r.opacity;
        }
        if (renderRippleCount > 0) device.queue.writeBuffer(ripplesRenderBuf, 0, ripplesCpu, 0, renderRippleCount * 4);

        renderDmCount = Math.min(darkMatterParticles.length, MAX_DM);
        for (let k = 0; k < renderDmCount; k++) {
          const m = darkMatterParticles[k];
          dmCpu[k * 4] = m.x; dmCpu[k * 4 + 1] = m.y; dmCpu[k * 4 + 2] = 0; dmCpu[k * 4 + 3] = 0;
        }
        if (renderDmCount > 0) device.queue.writeBuffer(dmBuf, 0, dmCpu, 0, renderDmCount * 4);

        const enc = device.createCommandEncoder();
        const pass = enc.beginRenderPass({
          colorAttachments: [{
            view: R.msaaView,
            resolveTarget: gctx.getCurrentTexture().createView(),
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
            loadOp: 'clear', storeOp: 'discard'
          }]
        });
        pass.setBindGroup(0, R.bgRender[parity]);
        if (renderRippleCount > 0) { pass.setPipeline(rpRipple); pass.draw(6, renderRippleCount); }
        pass.setPipeline(rpGlow);     pass.draw(6, N);
        pass.setPipeline(rpParticle); pass.draw(6, N);
        if (renderDmCount > 0) { pass.setPipeline(rpDm); pass.draw(6, renderDmCount); }
        pass.end();
        device.queue.submit([enc.finish()]);
      }

      return { name: 'webgpu', triggerCollapse, step, render, rebuild, snapshot };
    }

    // ===== 主迴圈：固定步長物理 + 每幀繪製 =====
    let lastFrameTime = -1;
    let accumulator = 0;
    let resizing = false;

    // v24 幀節奏：
    //  (1) vsync 吸附：rAF 間隔在 60Hz 螢幕上會在 16.67ms 附近抖動（16.5 / 16.8 …），
    //      v23 的累加器因此偶爾出現「這幀 0 步、下幀 2 步」，就是肉眼看到的細微頓挫。
    //      間隔落在步長整數倍 ±VSYNC_SNAP_MS 內時直接視為整數倍 → 60Hz 下穩定每幀 1 步。
    //  (2) 插值繪製：以 accumulator/STEP_MS 在上一步與這一步的位置間插值，
    //      75/120/144Hz 螢幕（每幀 0 或 1 步）也能平滑。
    //  (3) CPU 多執行緒時 step 是非同步的：一次只會有一步在飛，完成後若仍落後就立刻接著算下一步。
    const VSYNC_SNAP_MS = 1.0;
    let asyncBusy = false;

    function pumpAsync() {
      if (asyncBusy || resizing || accumulator < STEP_MS) return;
      asyncBusy = true;
      const now = performance.now();
      backend.stepAsync(now).then(() => {
        accumulator -= STEP_MS;
        asyncBusy = false;
        pumpAsync();
      }, (err) => {
        console.error('step 失敗：', err);
        accumulator -= STEP_MS;
        asyncBusy = false;
      });
    }

    function animate(now) {
      if (resizing) { requestAnimationFrame(animate); return; }
      if (lastFrameTime < 0) lastFrameTime = now;
      let dt = now - lastFrameTime;
      lastFrameTime = now;
      if (dt > MAX_FRAME_DT) dt = MAX_FRAME_DT;
      for (let m = 1; m <= MAX_STEPS_PER_FRAME; m++) {
        if (Math.abs(dt - m * STEP_MS) < VSYNC_SNAP_MS) { dt = m * STEP_MS; break; }
      }
      accumulator += dt;

      if (backend.stepAsync) {
        // 落後太多（機器跑不動）就丟掉欠帳，避免越積越多
        if (accumulator > MAX_STEPS_PER_FRAME * STEP_MS) accumulator = STEP_MS;
        pumpAsync();
      } else {
        let steps = 0;
        while (accumulator >= STEP_MS && steps < MAX_STEPS_PER_FRAME) {
          backend.step(now);
          accumulator -= STEP_MS;
          steps++;
        }
        if (accumulator >= STEP_MS) accumulator = 0;
      }

      const alpha = accumulator <= 0 ? 0 : accumulator >= STEP_MS ? 1 : accumulator / STEP_MS;
      backend.render(now, alpha);
      requestAnimationFrame(animate);
    }

    // ===== 畫布尺寸管理 =====
    // 偽全螢幕：瀏覽器不支援元素 fullscreen（iPhone 上的 Safari / Chrome / 任何 iOS 瀏覽器）時，
    // 改為讓畫布填滿可視區，模擬尺寸跟著視窗走（網址列等瀏覽器 UI 無法由網頁隱藏）。
    let pseudoFullscreen = false;

    function isFullscreenLike() {
      return pseudoFullscreen
          || !!(document.fullscreenElement || document.webkitFullscreenElement)
          || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
          || navigator.standalone === true;
    }

    // 回傳目標模擬尺寸（CSS px）與顯示縮放
    function computeLayout() {
      const vw = window.innerWidth, vh = window.innerHeight;
      if (isFullscreenLike()) {
        return { w: Math.max(200, Math.round(vw)), h: Math.max(200, Math.round(vh)), scale: 1 };
      }
      // 非全螢幕：模擬尺寸固定，視窗太小時只縮小顯示
      const scale = Math.min(1, vw / WINDOWED_WIDTH, vh / WINDOWED_HEIGHT);
      return { w: WINDOWED_WIDTH, h: WINDOWED_HEIGHT, scale };
    }

    function effectiveDpr(w, h) {
      const dpr = Math.min(MAX_DPR, window.devicePixelRatio || 1);
      return Math.min(dpr, Math.sqrt(MAX_BACKING_PIXELS / (w * h)));
    }

    function applyCanvasSize(w, h, scale) {
      DPR = effectiveDpr(w, h);
      canvas.width = Math.round(w * DPR);
      canvas.height = Math.round(h * DPR);
      canvas.style.width = (w * scale) + 'px';
      canvas.style.height = (h * scale) + 'px';
    }

    // v24：applyLayout 是 async（GPU 要等讀回），連續 resize 時不可重入，
    // 否則兩次 snapshot 會對同一個 staging buffer 同時 mapAsync。改為序列化：執行中再收到請求就排一次重跑。
    let layoutRunning = false, layoutAgain = false;
    async function applyLayout(initial) {
      if (layoutRunning) { layoutAgain = true; return; }
      layoutRunning = true;
      try {
        await applyLayoutOnce(initial);
        while (layoutAgain) { layoutAgain = false; await applyLayoutOnce(false); }
      } finally {
        layoutRunning = false;
      }
    }

    async function applyLayoutOnce(initial) {
      const { w, h, scale } = computeLayout();
      const dpr = effectiveDpr(w, h);
      if (!initial && w === CANVAS_WIDTH && h === CANVAS_HEIGHT && dpr === DPR) {
        canvas.style.width = (w * scale) + 'px';
        canvas.style.height = (h * scale) + 'px';
        return;
      }
      resizing = true;
      try {
        while (asyncBusy) await new Promise(r => setTimeout(r, 1));
        if (!initial) await backend.snapshot();
        const n = targetParticleCount(w, h);
        allocateWorld(w, h, n, !initial);
        applyCanvasSize(w, h, scale);
        backend.rebuild();
        document.title = `Particle Life v24 [${backend.name}, ${w}×${h}, N=${N}]`;
        console.log(`backend=${backend.name} size=${w}x${h} dpr=${DPR} N=${N}`);
      } finally {
        accumulator = 0;
        lastFrameTime = -1;
        resizing = false;
      }
    }

    let resizeTimer = 0;
    function scheduleLayout() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => applyLayout(false), 150);
    }
    window.addEventListener('resize', scheduleLayout);
    window.addEventListener('orientationchange', scheduleLayout);
    document.addEventListener('fullscreenchange', scheduleLayout);
    document.addEventListener('webkitfullscreenchange', scheduleLayout);
    if (window.matchMedia) {
      const mq = window.matchMedia('(display-mode: standalone)');
      if (mq.addEventListener) mq.addEventListener('change', scheduleLayout);
    }

    (async () => {
      try {
        if (FORCE_CPU) throw new Error('?gpu=0');
        backend = await createGpuBackend();
      } catch (e) {
        console.warn('WebGPU 不可用，退回 CPU backend：', e.message);
        backend = createCpuBackend();
      }
      await applyLayout(true);
      lastChangeTime = performance.now();
      transitionStartTime = lastChangeTime;
      rebuildColors();
      requestAnimationFrame(animate);
    })();

    // 全螢幕：iOS 上所有瀏覽器（含 Chrome）都是 WebKit 核心。iPadOS 支援元素 fullscreen，
    // iPhone 不支援（只有 <video> 能全螢幕）：requestFullscreen 不存在、fullscreenEnabled 為 false，
    // 原本的點擊因此什麼都不做。改為：支援就用真全螢幕；不支援或請求失敗就切換偽全螢幕。
    // 完整全螢幕（連網址列都隱藏）在 iPhone 上只能用「加入主畫面」以 standalone 開啟。
    function setPseudoFullscreen(on) {
      if (pseudoFullscreen === on) return;
      pseudoFullscreen = on;
      if (on) window.scrollTo(0, 0);
      applyLayout(false);
    }

    canvas.addEventListener('click', () => {
      const el = document.documentElement;
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        return;
      }
      if (pseudoFullscreen) { setPseudoFullscreen(false); return; }

      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      const enabled = document.fullscreenEnabled !== undefined ? document.fullscreenEnabled
                    : document.webkitFullscreenEnabled !== undefined ? document.webkitFullscreenEnabled
                    : !!req;
      if (!req || !enabled) { setPseudoFullscreen(true); return; }
      try {
        const p = req.call(el);
        if (p && typeof p.catch === 'function') p.catch(() => setPseudoFullscreen(true));
      } catch (e) {
        setPseudoFullscreen(true);
      }
    });
  </script>

</body></html>
