<html lang="zh-Hant"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="theme-color" content="#000000">
  <title>Particle Life v24 [cpu, 1000×620, N=3000]</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
      touch-action: none;
      overscroll-behavior: none;
    }
    canvas {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="particleCanvas" width="1000" height="620" style="width: 1000px; height: 620px;"></canvas>
  <script>
    'use strict';
    const canvas = document.getElementById('particleCanvas');

    // ===== 畫布尺寸（CSS px；模擬座標單位）=====
    // 非全螢幕：固定 1000×620（需要時只縮小顯示，不改模擬尺寸）
    // 全螢幕／standalone：跟著視窗走，粒子數依固定密度換算
    const WINDOWED_WIDTH = 1000;
    const WINDOWED_HEIGHT = 620;
    const DENSITY = 3000 / (WINDOWED_WIDTH * WINDOWED_HEIGHT);   // 原設計密度
    const MAX_DPR = 2;
    const MAX_BACKING_PIXELS = 8e6;   // 後備緩衝上限（MSAA 4x 下約 128 MB），超過就降 DPR
    let CANVAS_WIDTH = WINDOWED_WIDTH;
    let CANVAS_HEIGHT = WINDOWED_HEIGHT;
    let CANVAS_WIDTH_MINUS_EDGE = CANVAS_WIDTH - 5;
    let CANVAS_HEIGHT_MINUS_EDGE = CANVAS_HEIGHT - 5;
    let DPR = 1;
    const NEARBY_RADIUS_SQUARED = 100 * 100;
    const MIN_DISTANCE_SQUARED = 7 * 7;
    const MIN_DISTANCE_RIPPLE_SQUARED = 3 * 3;
    const CLUSTER_RADIUS_SQUARED = 50 * 50;
    const DARK_MATTER_RADIUS_SQUARED = 30 * 30;
    const PI2 = Math.PI * 2;

    // ===== 時間基準：固定步長 =====
    const STEP_MS = 1000 / 60;
    const MAX_STEPS_PER_FRAME = 3;
    const MAX_FRAME_DT = 100;

    // ===== 色系系統（OKLCH 色盤旋轉）=====
    const TYPES = 12;
    const SLOT_L  = [0.3606,0.4826,0.7707,0.5893,0.8502,0.5067,0.5967,0.7506,0.4955,0.6598,0.4104,0.7909];
    const SLOT_C  = [0.0948,0.1272,0.1777,0.1146,0.1043,0.0509,0.1108,0.0565,0.0896,0.0495,0.0785,0.0669];
    const SLOT_DH = [0.40,0.57,-5.97,-14.40,-11.23,26.23,-1.50,16.17,-1.81,-8.19,3.12,-6.85];

    const PALETTE_NAMES     = ['綠', '黃/棕', '紅', '藍'];
    const PALETTE_BASE_HUE  = [128, 80, 25, -96];
    const HUE_STEP          = [48, 55, 121, 136];

    const BANGS_PER_SHIFT      = 10;
    const PALETTE_SHIFT_DURATION = 30000;

    let paletteStage      = 0;
    let paletteHue        = PALETTE_BASE_HUE[0];
    let paletteShifting   = false;
    let paletteShiftStart = 0;
    let paletteHueFrom    = paletteHue;
    let paletteHueTo      = paletteHue;
    let bangsSinceShift   = 0;

    const COLORS    = new Array(TYPES).fill('#000000');
    const COLOR_RGB = new Array(TYPES);
    for (let i = 0; i < TYPES; i++) COLOR_RGB[i] = { r: 0, g: 0, b: 0 };
    let colorsDirty = true;   // GPU backend 用：顏色變了才上傳

    function oklchToLinear(L, C, hDeg, out) {
      const h = hDeg * Math.PI / 180;
      const a = C * Math.cos(h);
      const b = C * Math.sin(h);
      const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
      const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
      const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
      const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
      out[0] =  4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
      out[1] = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
      out[2] = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
    }

    const _lin = [0, 0, 0];
    function inGamut(v) {
      return v[0] >= -0.0008 && v[0] <= 1.0008 &&
             v[1] >= -0.0008 && v[1] <= 1.0008 &&
             v[2] >= -0.0008 && v[2] <= 1.0008;
    }

    function linToSrgb255(c) {
      if (c < 0) c = 0; else if (c > 1) c = 1;
      const v = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
      return Math.round(v * 255);
    }

    const HEX2 = [];
    for (let i = 0; i < 256; i++) HEX2.push(i.toString(16).padStart(2, '0'));

    function rebuildColors() {
      for (let t = 0; t < TYPES; t++) {
        const L = SLOT_L[t], h = paletteHue + SLOT_DH[t];
        let C = SLOT_C[t];
        oklchToLinear(L, C, h, _lin);
        if (!inGamut(_lin)) {
          let lo = 0, hi = C;
          for (let k = 0; k < 14; k++) {
            const mid = (lo + hi) * 0.5;
            oklchToLinear(L, mid, h, _lin);
            if (inGamut(_lin)) lo = mid; else hi = mid;
          }
          C = lo;
        }
        oklchToLinear(L, C, h, _lin);
        const r = linToSrgb255(_lin[0]), g = linToSrgb255(_lin[1]), b = linToSrgb255(_lin[2]);
        const rgb = COLOR_RGB[t];
        rgb.r = r; rgb.g = g; rgb.b = b;
        COLORS[t] = '#' + HEX2[r] + HEX2[g] + HEX2[b];
      }
      colorsDirty = true;
    }

    function noteBangForPalette(now) {
      if (paletteShifting) return;
      if (++bangsSinceShift >= BANGS_PER_SHIFT) {
        bangsSinceShift = 0;
        paletteShifting = true;
        paletteShiftStart = now;
        paletteHueFrom = paletteHue;
        paletteHueTo = paletteHue - HUE_STEP[paletteStage];
      }
    }

    function updatePalette(now) {
      if (!paletteShifting) return;
      const t = Math.min((now - paletteShiftStart) / PALETTE_SHIFT_DURATION, 1);
      paletteHue = paletteHueFrom + (paletteHueTo - paletteHueFrom) * easeInOutSine(t);
      if (t >= 1) {
        paletteShifting = false;
        paletteStage = (paletteStage + 1) % 4;
        paletteHue = paletteHueTo;
        if (paletteStage === 0) paletteHue += 360;
      }
      rebuildColors();
    }

    // 粒子數：預設依 DENSITY × 面積換算（上限依 backend），?n=12345 可固定指定、?density=0.005 可改密度
    const URL_PARAMS = new URLSearchParams(location.search);
    const MANUAL_N = parseInt(URL_PARAMS.get('n'), 10) || 0;
    const DENSITY_OVERRIDE = parseFloat(URL_PARAMS.get('density')) || 0;
    // ?threads=0 強制 CPU 單執行緒；?threads=4 指定 worker 數；未指定則自動（核心數-1，上限 6）
    const THREADS_PARAM = URL_PARAMS.has('threads') ? Math.max(0, parseInt(URL_PARAMS.get('threads'), 10) || 0) : -1;
    // ?msaa=1 關閉 GPU 多重取樣（高 DPR / 內顯可省大量填充頻寬）；預設 4
    const MSAA_SAMPLES = URL_PARAMS.get('msaa') === '1' ? 1 : 4;
    // ?gpu=0 強制使用 CPU backend（比較用）
    const FORCE_CPU = URL_PARAMS.get('gpu') === '0';
    const MAX_N_GPU = 60000;
    const MAX_N_CPU = 3500;      // CPU 單執行緒上限
    const MAX_N_CPU_MT = 7000;   // CPU 多執行緒（worker 池）上限
    const MAX_FORCE = 0.2;
    const FRICTION = 0.68;
    const CHANGE_INTERVAL = 60000;
    const TRANSITION_DURATION = 30000;
    const REPULSION_STRENGTH = 0.5;
    const COINCIDENT_JITTER = 0.3;

    // ===== 極限坍縮 / 大爆炸 事件 =====
    const BANG_THRESHOLD = 660;
    const COLLAPSE_FRAMES = 70;
    const EXPLODE_FRAMES = 40;
    const COLLAPSE_PULL_BASE = 0.004;
    const COLLAPSE_PULL_GAIN = 0.25;
    const EXPLODE_SPEED = 14;
    const EXPLODE_TAIL = 1.5;
    const EXPLODE_JITTER = 0.15;
    const EXPLODE_ANGLE_JITTER = 0.3;
    const BANG_TRANSITION_DURATION = 8000;

    // ===== 噴散碰撞（v24.1）=====
    // 噴散中的粒子仍沿腳本方向飛行，但對沿途「非噴散」粒子做碰撞（只有碰撞，不受種類矩陣力）：
    //  - 對方被推開：推力 = BLAST_PUSH × 重疊度 w × 噴散粒子當前速度（快的撞得重）
    //  - 自己被偏折：方向 += BLAST_DEFLECT × Σ(w·法線)；正面撞上足夠多粒子就會反彈
    //  - 自己減速：速度係數 ÷= (1 + BLAST_DAMP × Σw)；撞進密集群聚會被吸收、停下
    // 以「這一步的移動線段」做掃掠檢測，高速時也不會穿透。噴散粒子彼此不碰撞（否則一出生就互相抵消）。
    const BLAST_COLLIDE_RADIUS = 8;
    const BLAST_COLLIDE_RADIUS_SQUARED = BLAST_COLLIDE_RADIUS * BLAST_COLLIDE_RADIUS;
    const BLAST_PUSH = 4.0;
    const BLAST_DEFLECT = 0.6;
    const BLAST_DAMP = 0.05;

    const TYPE_COLLAPSE_FACTOR = [1.0, 0.35, 0.7, 0.5, 0.9, 0.3, 0.6, 0.8, 0.45, 1.0, 0.55, 0.75];
    const TYPE_BLAST_FACTOR    = [0.4, 1.0, 0.6, 0.85, 0.3, 1.0, 0.5, 0.7, 0.95, 0.35, 0.8, 0.55];

    // ===== SoA 粒子資料（CPU 端）=====
    // CPU backend：這就是模擬本體。
    // GPU backend：posX/posY 是每 500 ms 讀回的快照，只供叢集偵測；pEvent 是 CPU 鏡像（權威）。
    // 全部宣告為 let：resize 時由 allocateWorld 重配，函式透過閉包看到新陣列。
    let N = 0;
    let posX, posY, velX, velY, forceX, forceY, pType, pClustered, pInRipple, pEvent, pullX, pullY;
    let prevX, prevY;   // 上一步的位置（繪製插值用）
    let drawOrder, typeStart;

    function targetParticleCount(w, h) {
      if (MANUAL_N > 0) return MANUAL_N;
      const density = DENSITY_OVERRIDE > 0 ? DENSITY_OVERRIDE : DENSITY;
      const cap = backend && backend.name === 'webgpu' ? MAX_N_GPU : backend && backend.stepAsync ? MAX_N_CPU_MT : MAX_N_CPU;
      return Math.max(100, Math.min(cap, Math.round(density * w * h)));
    }

    // 依新尺寸重配所有粒子與網格陣列。carry=true 時保留既有粒子（位置等比縮放），不足補隨機、過多砍尾。
    function allocateWorld(w, h, n, carry) {
      const oldN = N, oldW = CANVAS_WIDTH, oldH = CANVAS_HEIGHT;
      const o = { posX, posY, velX, velY, pType };
      CANVAS_WIDTH = w; CANVAS_HEIGHT = h;
      CANVAS_WIDTH_MINUS_EDGE = w - 5; CANVAS_HEIGHT_MINUS_EDGE = h - 5;
      N = n;

      posX = new Float32Array(N); posY = new Float32Array(N);
      velX = new Float32Array(N); velY = new Float32Array(N);
      forceX = new Float32Array(N); forceY = new Float32Array(N);
      pType = new Uint8Array(N);
      pClustered = new Uint8Array(N); pInRipple = new Uint8Array(N); pEvent = new Uint8Array(N);
      pullX = new Float32Array(N); pullY = new Float32Array(N);

      const keep = carry ? Math.min(oldN, N) : 0;
      if (keep > 0) {
        const sx = w / oldW, sy = h / oldH;
        for (let i = 0; i < keep; i++) {
          posX[i] = o.posX[i] * sx; posY[i] = o.posY[i] * sy;
          velX[i] = o.velX[i]; velY[i] = o.velY[i];
          pType[i] = o.pType[i];
        }
      }
      for (let i = keep; i < N; i++) {
        posX[i] = Math.random() * w;
        posY[i] = Math.random() * h;
        velX[i] = Math.random() * 2 - 1;
        velY[i] = Math.random() * 2 - 1;
        pType[i] = (Math.random() * TYPES) | 0;
      }

      prevX = Float32Array.from(posX); prevY = Float32Array.from(posY);

      drawOrder = new Int32Array(N);
      for (let i = 0; i < N; i++) drawOrder[i] = i;
      drawOrder.sort((a, b) => pType[a] - pType[b]);
      typeStart = new Int32Array(TYPES + 1);
      for (let i = 0; i < N; i++) typeStart[pType[i] + 1]++;
      for (let t = 0; t < TYPES; t++) typeStart[t + 1] += typeStart[t];

      allocateGrid();
      // 事件與漣漪的幾何在縮放後已無意義，全部清空；矩陣與色系狀態保留
      bangEvents.length = 0;
      ripples.length = 0;
      rippleSources.length = 0;
      darkMatterParticles.length = 0;
      lastClusterCheckTime = -Infinity;
    }

    // ===== 互動矩陣 =====
    function fillRandomMatrix(m) {
      for (let i = 0; i < m.length; i++) {
        m[i] = Math.random() * 2 * MAX_FORCE - MAX_FORCE;
      }
    }

    const oldMatrix = new Float32Array(TYPES * TYPES);
    const newMatrix = new Float32Array(TYPES * TYPES);
    const INTERACTION_MATRIX = new Float32Array(TYPES * TYPES);
    fillRandomMatrix(oldMatrix);
    fillRandomMatrix(newMatrix);
    INTERACTION_MATRIX.set(oldMatrix);

    let lastChangeTime = 0;
    let transitionStartTime = 0;
    let transitionDuration = TRANSITION_DURATION;
    let matrixTransitioning = true;

    function easeInOutSine(t) {
      return -(Math.cos(Math.PI * t) - 1) / 2;
    }

    function updateInteractionMatrix(now) {
      if (!matrixTransitioning) {
        if (now - lastChangeTime <= CHANGE_INTERVAL) return;
        lastChangeTime = now;
        transitionStartTime = now;
        transitionDuration = TRANSITION_DURATION;
        oldMatrix.set(newMatrix);
        fillRandomMatrix(newMatrix);
        matrixTransitioning = true;
      }
      const t = Math.min((now - transitionStartTime) / transitionDuration, 1);
      const smoothT = easeInOutSine(t);
      for (let i = 0; i < INTERACTION_MATRIX.length; i++) {
        INTERACTION_MATRIX[i] = oldMatrix[i] * (1 - smoothT) + newMatrix[i] * smoothT;
      }
      if (t >= 1) matrixTransitioning = false;
    }

    // 大爆炸的共同副作用（兩個 backend 共用）：矩陣重寫 + 色系計數
    function onBigBang(now) {
      oldMatrix.set(INTERACTION_MATRIX);
      fillRandomMatrix(newMatrix);
      transitionStartTime = now;
      transitionDuration = BANG_TRANSITION_DURATION;
      lastChangeTime = now;
      matrixTransitioning = true;
      noteBangForPalette(now);
    }

    // ===== 空間網格（CPU；CPU backend 每步用，GPU backend 讀回後叢集偵測用）=====
    const GRID_SIZE = 50;
    let GRID_WIDTH = 0, GRID_HEIGHT = 0, NUM_CELLS = 0;
    let cellStarts, cellCursor, cellParticles, particleCell;
    let clusterProcessed, clusterMembers;

    function allocateGrid() {
      GRID_WIDTH = Math.ceil(CANVAS_WIDTH / GRID_SIZE);
      GRID_HEIGHT = Math.ceil(CANVAS_HEIGHT / GRID_SIZE);
      NUM_CELLS = GRID_WIDTH * GRID_HEIGHT;
      cellStarts = new Int32Array(NUM_CELLS + 1);
      cellCursor = new Int32Array(NUM_CELLS);
      cellParticles = new Int32Array(N);
      particleCell = new Int32Array(N);
      clusterProcessed = new Uint8Array(N);
      clusterMembers = new Int32Array(N);
    }

    function rebuildGrid() {
      cellStarts.fill(0);
      for (let i = 0; i < N; i++) {
        if (pEvent[i] === 2) { particleCell[i] = -1; continue; }
        let gx = (posX[i] / GRID_SIZE) | 0;
        let gy = (posY[i] / GRID_SIZE) | 0;
        if (gx >= GRID_WIDTH) gx = GRID_WIDTH - 1;
        if (gy >= GRID_HEIGHT) gy = GRID_HEIGHT - 1;
        const c = gy * GRID_WIDTH + gx;
        particleCell[i] = c;
        cellStarts[c + 1]++;
      }
      for (let c = 0; c < NUM_CELLS; c++) {
        cellStarts[c + 1] += cellStarts[c];
        cellCursor[c] = cellStarts[c];
      }
      for (let i = 0; i < N; i++) {
        const c = particleCell[i];
        if (c < 0) continue;
        cellParticles[cellCursor[c]++] = i;
      }
    }

    // ===== 叢集偵測（共用；依賴 posX/posY/pEvent 與 CPU grid）=====
    let backend = null;   // 稍後決定：{ triggerCollapse, step, render }

    function updateClusters() {
      pClustered.fill(0);
      clusterProcessed.fill(0);
      const clusters = [];

      for (let i = 0; i < N; i++) {
        if (clusterProcessed[i] || pEvent[i]) continue;

        const xi = posX[i], yi = posY[i];
        let memberCount = 0;
        clusterMembers[memberCount++] = i;
        clusterProcessed[i] = 1;

        const gx = (xi / GRID_SIZE) | 0;
        const gy = (yi / GRID_SIZE) | 0;
        let xMin = gx - 1; if (xMin < 0) xMin = 0;
        let xMax = gx + 1; if (xMax > GRID_WIDTH - 1) xMax = GRID_WIDTH - 1;
        let yMin = gy - 1; if (yMin < 0) yMin = 0;
        let yMax = gy + 1; if (yMax > GRID_HEIGHT - 1) yMax = GRID_HEIGHT - 1;

        for (let cy = yMin; cy <= yMax; cy++) {
          const rowOffset = cy * GRID_WIDTH;
          for (let cx = xMin; cx <= xMax; cx++) {
            const c = rowOffset + cx;
            const end = cellStarts[c + 1];
            for (let s = cellStarts[c]; s < end; s++) {
              const j = cellParticles[s];
              if (clusterProcessed[j] || pEvent[j]) continue;
              const dx = posX[j] - xi;
              const dy = posY[j] - yi;
              if (dx * dx + dy * dy < CLUSTER_RADIUS_SQUARED) {
                clusterMembers[memberCount++] = j;
                clusterProcessed[j] = 1;
              }
            }
          }
        }

        if (memberCount >= BANG_THRESHOLD) {
          backend.triggerCollapse(clusterMembers.slice(0, memberCount));
          continue;
        }

        if (memberCount >= 300) {
          let centerX = 0, centerY = 0;
          for (let m = 0; m < memberCount; m++) {
            const idx = clusterMembers[m];
            pClustered[idx] = 1;
            centerX += posX[idx];
            centerY += posY[idx];
          }
          clusters.push({ x: centerX / memberCount, y: centerY / memberCount });
        }
      }
      return clusters;
    }


    // ===== 漣漪與來源追蹤（共用）=====
    class Ripple {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 0;
        this.maxRadius = 300;
        this.speed = 2;
        this.opacity = 0.8;
      }
      update() {
        this.radius += this.speed;
        this.opacity = 0.8 * (1 - this.radius / this.maxRadius);
        return this.opacity > 0;
      }
    }

    const bangEvents = [];
    const ripples = [];
    const rippleSources = [];
    const RIPPLE_MATCH_RADIUS_SQUARED = 50 * 50;
    const RIPPLE_SOURCE_EXPIRE = 10000;
    const RIPPLE_COOLDOWN = 5000;
    const CLUSTER_CHECK_INTERVAL = 500;
    let lastClusterCheckTime = -Infinity;

    // 一次偵測結果 → 更新來源名單。now 是這次偵測所屬的時間戳。
    function applyClusters(clusters, now) {
      lastClusterCheckTime = now;
      for (const c of clusters) {
        let best = null, bestD2 = RIPPLE_MATCH_RADIUS_SQUARED;
        for (const src of rippleSources) {
          if (src.lastSeen === now) continue;
          const dx = src.x - c.x, dy = src.y - c.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < bestD2) { bestD2 = d2; best = src; }
        }
        if (best) {
          best.x = c.x; best.y = c.y; best.lastSeen = now;
        } else {
          rippleSources.push({ x: c.x, y: c.y, lastRipple: -Infinity, lastSeen: now });
        }
      }
      for (let i = rippleSources.length - 1; i >= 0; i--) {
        if (now - rippleSources[i].lastSeen > RIPPLE_SOURCE_EXPIRE) rippleSources.splice(i, 1);
      }
    }

    function emitAndAdvanceRipples(now) {
      for (const src of rippleSources) {
        if (src.lastSeen !== lastClusterCheckTime) continue;
        if (now - src.lastRipple >= RIPPLE_COOLDOWN) {
          src.lastRipple = now;
          ripples.push(new Ripple(src.x, src.y));
          if (Math.random() < 0.05) {
            darkMatterParticles.push(new DarkMatterParticle(src.x, src.y, now));
          }
        }
      }
      for (let i = ripples.length - 1; i >= 0; i--) {
        if (!ripples[i].update()) ripples.splice(i, 1);
      }
    }

    // ===== 暗物質（共用：自身運動在 CPU；對粒子的推力由各 backend 實作）=====
    class DarkMatterParticle {
      constructor(x, y, now) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 20;
        this.vy = (Math.random() - 0.5) * 20;
        this.radius = 2;
        this.lifetime = 5000;
        this.activeTime = 2000;
        this.creationTime = now;
        this.repulsion = 0;   // 0 = 尚未啟動
      }
      move(now) {
        this.vx += (Math.random() - 0.5) * 10;
        this.vy += (Math.random() - 0.5) * 10;
        this.vx = Math.max(-10, Math.min(10, this.vx));
        this.vy = Math.max(-10, Math.min(10, this.vy));
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0) this.x = 0, this.vx *= -1;
        if (this.x > CANVAS_WIDTH) this.x = CANVAS_WIDTH, this.vx *= -1;
        if (this.y < 0) this.y = 0, this.vy *= -1;
        if (this.y > CANVAS_HEIGHT) this.y = CANVAS_HEIGHT, this.vy *= -1;

        const age = now - this.creationTime;
        if (age < this.activeTime) { this.repulsion = 0; return; }
        const timeFactor = Math.exp((age - this.activeTime) / 1000) - 1;
        this.repulsion = 1 + timeFactor * 10;
      }
      isExpired(now) {
        return now - this.creationTime > this.lifetime;
      }
    }
    const darkMatterParticles = [];

    // ===================================================================
    // CPU backend（= v21，Canvas 2D）
    // ===================================================================
    function createCpuBackend() {
      const ctx = canvas.getContext('2d');

      // ---- v24：依格子排序的連續 SoA 工作陣列 ----
      // rebuildGrid 後把粒子資料按 cellParticles 順序複製成連續陣列，配對迴圈直接線性掃描，
      // 免去 cellParticles[s] → posX[j] 的間接定址，記憶體存取變成循序。
      // 又因格子是 row-major，同一列 cx-2..cx+2 五格在排序陣列中是一段連續區間，
      // 原本 13 個格子的配對迴圈可合併成 3 段連續區間。
      let sX = null, sY = null, sRow = null, sCol = null, sMinD2 = null, sMinD = null, sFX = null, sFY = null, sTR = null;
      function ensureSorted() {
        if (sX && sX.length === N) return;
        sX = new Float32Array(N); sY = new Float32Array(N);
        sRow = new Int32Array(N); sCol = new Int32Array(N);
        sMinD2 = new Float32Array(N); sMinD = new Float32Array(N);
        sFX = new Float32Array(N); sFY = new Float32Array(N);
        sTR = new Uint8Array(N);
      }

      function packSorted(M) {
        const cp = cellParticles, px = posX, py = posY, pt = pType, pr = pInRipple;
        const X = sX, Y = sY, RW = sRow, CL = sCol, MD2 = sMinD2, MD = sMinD, FX = sFX, FY = sFY, TR = sTR;
        for (let k = 0; k < M; k++) {
          const i = cp[k];
          X[k] = px[i]; Y[k] = py[i];
          const t = pt[i];
          RW[k] = t * TYPES; CL[k] = t;
          if (pr[i]) { MD2[k] = MIN_DISTANCE_RIPPLE_SQUARED; MD[k] = 3; TR[k] = t | 16; }
          else { MD2[k] = MIN_DISTANCE_SQUARED; MD[k] = 7; TR[k] = t; }
          FX[k] = 0; FY[k] = 0;
        }
      }

      // 粒子 s（排序後索引）與連續區間 [b, e) 的雙向配對力（牛頓第三定律，每對只算一次）
      function pairSpan(s, b, e, X, Y, RW, CL, MD2, MD, FX, FY, MAT) {
        const xi = X[s], yi = Y[s], rowI = RW[s], ti = CL[s];
        const minD2i = MD2[s], minDi = MD[s];
        let fx = 0, fy = 0;
        for (let k = b; k < e; k++) {
          const dx = X[k] - xi, dy = Y[k] - yi;
          const d2 = dx * dx + dy * dy;
          if (d2 >= NEARBY_RADIUS_SQUARED) continue;

          if (d2 === 0) {
            const a = Math.random() * PI2;
            const jx = Math.cos(a) * COINCIDENT_JITTER, jy = Math.sin(a) * COINCIDENT_JITTER;
            fx += jx; fy += jy;
            FX[k] -= jx; FY[k] -= jy;
            continue;
          }

          const mult = (d2 < 400 ? -2 : d2 < 2500 ? 20 : 10) / d2;
          let dist = -1;

          if (d2 < minD2i) {
            dist = Math.sqrt(d2);
            const sr = REPULSION_STRENGTH * (1 - dist / minDi) / dist;
            fx -= sr * dx; fy -= sr * dy;
          } else {
            const f = MAT[rowI + CL[k]] * mult;
            fx += f * dx; fy += f * dy;
          }

          if (d2 < MD2[k]) {
            if (dist < 0) dist = Math.sqrt(d2);
            const sr = REPULSION_STRENGTH * (1 - dist / MD[k]) / dist;
            FX[k] += sr * dx; FY[k] += sr * dy;
          } else {
            const f = MAT[RW[k] + ti] * mult;
            FX[k] -= f * dx; FY[k] -= f * dy;
          }
        }
        FX[s] += fx;
        FY[s] += fy;
      }

      // 對格子範圍 [cFrom, cTo) 內的粒子做半對配對（與 worker 內的版本邏輯相同）
      function pairCells(cFrom, cTo, X, Y, RW, CL, MD2, MD, FX, FY, MAT, cs, GW, GH) {
        for (let c = cFrom; c < cTo; c++) {
          const aStart = cs[c], aEnd = cs[c + 1];
          if (aStart === aEnd) continue;
          const cy = (c / GW) | 0, cx = c - cy * GW;
          const row0 = cy * GW, row1 = row0 + GW, row2 = row1 + GW;
          const has1 = cy + 1 < GH, has2 = cy + 2 < GH;
          const lo = cx - 2 < 0 ? 0 : cx - 2;
          const hi = (cx + 2 > GW - 1 ? GW - 1 : cx + 2) + 1;
          // 本列：自己格子內 s 之後 + 右邊兩格 → 連續區間 [s+1, e0)
          const e0 = cs[row0 + hi];
          // 下一列、下兩列：cx-2..cx+2 → 各一段連續區間
          const b1 = has1 ? cs[row1 + lo] : 0, e1 = has1 ? cs[row1 + hi] : 0;
          const b2 = has2 ? cs[row2 + lo] : 0, e2 = has2 ? cs[row2 + hi] : 0;
          for (let s = aStart; s < aEnd; s++) {
            pairSpan(s, s + 1, e0, X, Y, RW, CL, MD2, MD, FX, FY, MAT);
            if (b1 < e1) pairSpan(s, b1, e1, X, Y, RW, CL, MD2, MD, FX, FY, MAT);
            if (b2 < e2) pairSpan(s, b2, e2, X, Y, RW, CL, MD2, MD, FX, FY, MAT);
          }
        }
      }

      // 排序空間的力散佈回粒子索引（脫離 grid 的爆炸粒子力為 0）
      function scatterForces(M) {
        forceX.fill(0);
        forceY.fill(0);
        const cp = cellParticles, fxo = forceX, fyo = forceY, FX = sFX, FY = sFY;
        for (let k = 0; k < M; k++) {
          const i = cp[k];
          fxo[i] = FX[k]; fyo[i] = FY[k];
        }
      }

      function computePairForces() {
        const M = cellStarts[NUM_CELLS];
        ensureSorted();
        packSorted(M);
        pairCells(0, NUM_CELLS, sX, sY, sRow, sCol, sMinD2, sMinD, sFX, sFY, INTERACTION_MATRIX, cellStarts, GRID_WIDTH, GRID_HEIGHT);
        scatterForces(M);
      }


      function createForcePool() {
        const hc = navigator.hardwareConcurrency || 1;
        const size = THREADS_PARAM >= 0 ? THREADS_PARAM : Math.min(6, hc - 1);
        if (size < 2 || typeof Worker === 'undefined' || typeof Blob === 'undefined') return null;
        const src = `'use strict';
          const TYPES = ${TYPES}, NEARBY_RADIUS_SQUARED = ${NEARBY_RADIUS_SQUARED};
          const MIN_DISTANCE_SQUARED = ${MIN_DISTANCE_SQUARED}, MIN_DISTANCE_RIPPLE_SQUARED = ${MIN_DISTANCE_RIPPLE_SQUARED};
          const REPULSION_STRENGTH = ${REPULSION_STRENGTH}, COINCIDENT_JITTER = ${COINCIDENT_JITTER}, PI2 = Math.PI * 2;
          ${pairSpan.toString()}
          ${pairCells.toString()}
          let RW = new Int32Array(0), CL, MD2, MD, FX, FY;
          onmessage = (e) => {
            const d = e.data;
            const { M, GW, GH, NC, cFrom, cTo, X, Y, TR, cs, OX, OY, MAT } = d;
            if (RW.length < M) {
              const cap = X.length;
              RW = new Int32Array(cap); CL = new Int32Array(cap);
              MD2 = new Float32Array(cap); MD = new Float32Array(cap);
              FX = new Float32Array(cap); FY = new Float32Array(cap);
            }
            const lastRow = ((cTo - 1) / GW) | 0;
            const lo = cs[cFrom], hi = cs[Math.min(NC, (lastRow + 3) * GW)];
            for (let k = lo; k < hi; k++) {
              const v = TR[k], t = v & 15;
              RW[k] = t * TYPES; CL[k] = t;
              if (v & 16) { MD2[k] = MIN_DISTANCE_RIPPLE_SQUARED; MD[k] = 3; }
              else { MD2[k] = MIN_DISTANCE_SQUARED; MD[k] = 7; }
              FX[k] = 0; FY[k] = 0;
            }
            pairCells(cFrom, cTo, X, Y, RW, CL, MD2, MD, FX, FY, MAT, cs, GW, GH);
            OX.set(FX.subarray(lo, hi)); OY.set(FY.subarray(lo, hi));
            postMessage({ k: d.k, lo, hi, X, Y, TR, cs, OX, OY },
                        [X.buffer, Y.buffer, TR.buffer, cs.buffer, OX.buffer, OY.buffer]);
          };`;
        let url;
        const workers = [];
        try {
          url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
          for (let k = 0; k < size; k++) workers.push(new Worker(url));
        } catch (e) {
          console.warn('Worker 無法建立，CPU 改用單執行緒：', e.message);
          for (const w of workers) w.terminate();
          return null;
        }
        const bufs = [], waiting = [];
        const fail = (err) => {
          if (pool.dead) return;
          pool.dead = true;
          console.warn('Worker 失敗，CPU 改用單執行緒：', err && err.message);
          for (const w of waiting) if (w) w.reject(err || new Error('worker error'));
        };
        for (let k = 0; k < size; k++) {
          bufs.push(null);
          waiting.push(null);
          workers[k].onmessage = (e) => {
            const w = waiting[k]; waiting[k] = null;
            const d = e.data;
            bufs[k] = { X: d.X, Y: d.Y, TR: d.TR, cs: d.cs, OX: d.OX, OY: d.OY };
            if (w) w.resolve({ k, lo: d.lo, hi: d.hi, FX: d.OX, FY: d.OY });
          };
          workers[k].onerror = (e) => { e.preventDefault && e.preventDefault(); fail(new Error(e.message || 'worker error')); };
        }
        const pool = {
          size, dead: false, bounds: new Int32Array(size + 1),
          run(k, M, cFrom, cTo) {
            let b = bufs[k];
            if (!b || b.X.length < N || b.cs.length < NUM_CELLS + 1) {
              b = { X: new Float32Array(N), Y: new Float32Array(N), TR: new Uint8Array(N),
                    cs: new Int32Array(NUM_CELLS + 1), OX: new Float32Array(N), OY: new Float32Array(N) };
            }
            bufs[k] = null;
            b.X.set(sX.subarray(0, M)); b.Y.set(sY.subarray(0, M)); b.TR.set(sTR.subarray(0, M));
            b.cs.set(cellStarts);
            return new Promise((resolve, reject) => {
              waiting[k] = { resolve, reject };
              workers[k].postMessage({
                k, M, GW: GRID_WIDTH, GH: GRID_HEIGHT, NC: NUM_CELLS, cFrom, cTo,
                X: b.X, Y: b.Y, TR: b.TR, cs: b.cs, OX: b.OX, OY: b.OY, MAT: INTERACTION_MATRIX
              }, [b.X.buffer, b.Y.buffer, b.TR.buffer, b.cs.buffer, b.OX.buffer, b.OY.buffer]);
            });
          },
          release() { /* 緩衝已在 onmessage 收回 */ }
        };
        return pool;
      }

      // ---- v24：多核心平行（Web Worker 池）----
      // 主執行緒做排序打包，把格子依「預估配對量」切成 K 段連續範圍分給 K 個 worker；
      // 每個 worker 仍用牛頓第三定律半對計算，力寫到自己的區段緩衝，回來後主執行緒相加。
      // 因為 worker 回覆是非同步的，這條路徑的 step 也是非同步（stepAsync）。
      const pool = createForcePool();
      let poolPending = null;   // 進行中的 step（Promise），resize 前要等它

      function partitionCells(K, bounds) {
        const cs = cellStarts, GW = GRID_WIDTH, GH = GRID_HEIGHT, NC = NUM_CELLS;
        // 每格工作量 ≈ 格內粒子數 × 其 3 段配對區間總長
        let total = 0;
        const w = cellWork.length >= NC ? cellWork : (cellWork = new Float64Array(NC));
        for (let c = 0; c < NC; c++) {
          const n = cs[c + 1] - cs[c];
          if (n === 0) { w[c] = 0; continue; }
          const cy = (c / GW) | 0, cx = c - cy * GW;
          const lo = cx - 2 < 0 ? 0 : cx - 2, hi = (cx + 2 > GW - 1 ? GW - 1 : cx + 2) + 1;
          let span = cs[cy * GW + hi] - cs[c];
          if (cy + 1 < GH) span += cs[(cy + 1) * GW + hi] - cs[(cy + 1) * GW + lo];
          if (cy + 2 < GH) span += cs[(cy + 2) * GW + hi] - cs[(cy + 2) * GW + lo];
          w[c] = n * span + n;
          total += w[c];
        }
        bounds[0] = 0;
        let acc = 0, k = 1;
        for (let c = 0; c < NC && k < K; c++) {
          acc += w[c];
          if (acc >= total * k / K) bounds[k++] = c + 1;
        }
        while (k <= K) bounds[k++] = NC;
      }
      let cellWork = new Float64Array(0);

      function computePairForcesParallel() {
        const M = cellStarts[NUM_CELLS];
        ensureSorted();
        packSorted(M);
        const K = pool.size;
        const bounds = pool.bounds;
        partitionCells(K, bounds);
        const jobs = [];
        for (let k = 0; k < K; k++) {
          if (bounds[k] === bounds[k + 1]) continue;
          jobs.push(pool.run(k, M, bounds[k], bounds[k + 1]));
        }
        return Promise.all(jobs).then(results => {
          const FX = sFX, FY = sFY;
          FX.fill(0, 0, M); FY.fill(0, 0, M);
          for (const r of results) {
            const lo = r.lo, n = r.hi - r.lo, rx = r.FX, ry = r.FY;
            for (let q = 0; q < n; q++) { FX[lo + q] += rx[q]; FY[lo + q] += ry[q]; }
            pool.release(r);
          }
          scatterForces(M);
        });
      }

      function integrateParticles() {
        for (let i = 0; i < N; i++) {
          const evState = pEvent[i];
          if (evState === 2) continue;
          let fx = forceX[i], fy = forceY[i];
          if (evState === 1) { fx += pullX[i]; fy += pullY[i]; }
          let vx = (velX[i] + fx) * FRICTION;
          let vy = (velY[i] + fy) * FRICTION;
          let x = posX[i] + vx;
          let y = posY[i] + vy;
          if (x < 0) { x = 0; vx = Math.abs(vx) < 0.5 ? 0.5 : Math.abs(vx); }
          else if (x > CANVAS_WIDTH) { x = CANVAS_WIDTH; vx = Math.abs(vx) < 0.5 ? -0.5 : -Math.abs(vx); }
          if (y < 0) { y = 0; vy = Math.abs(vy) < 0.5 ? 0.5 : Math.abs(vy); }
          else if (y > CANVAS_HEIGHT) { y = CANVAS_HEIGHT; vy = Math.abs(vy) < 0.5 ? -0.5 : -Math.abs(vy); }
          if (x < 5) vx += 5;
          else if (x > CANVAS_WIDTH_MINUS_EDGE) vx -= 5;
          if (y < 5) vy += 5;
          else if (y > CANVAS_HEIGHT_MINUS_EDGE) vy -= 5;
          posX[i] = x; posY[i] = y; velX[i] = vx; velY[i] = vy;
        }
      }

      function pushDarkMatter(dmp) {
        const repulsion = dmp.repulsion;
        if (repulsion === 0) return;
        const gx = (dmp.x / GRID_SIZE) | 0;
        const gy = (dmp.y / GRID_SIZE) | 0;
        let xMin = gx - 1; if (xMin < 0) xMin = 0;
        let xMax = gx + 1; if (xMax > GRID_WIDTH - 1) xMax = GRID_WIDTH - 1;
        let yMin = gy - 1; if (yMin < 0) yMin = 0;
        let yMax = gy + 1; if (yMax > GRID_HEIGHT - 1) yMax = GRID_HEIGHT - 1;
        for (let cy = yMin; cy <= yMax; cy++) {
          const rowOffset = cy * GRID_WIDTH;
          for (let cx = xMin; cx <= xMax; cx++) {
            const c = rowOffset + cx;
            const end = cellStarts[c + 1];
            for (let s = cellStarts[c]; s < end; s++) {
              const j = cellParticles[s];
              const dx = posX[j] - dmp.x;
              const dy = posY[j] - dmp.y;
              const d2 = dx * dx + dy * dy;
              if (d2 < DARK_MATTER_RADIUS_SQUARED && d2 > 0.01) {
                const s2 = repulsion / Math.sqrt(d2);
                velX[j] += s2 * dx;
                velY[j] += s2 * dy;
              }
            }
          }
        }
      }

      function updateDarkMatter(now) {
        for (let i = darkMatterParticles.length - 1; i >= 0; i--) {
          const dmp = darkMatterParticles[i];
          dmp.move(now);
          pushDarkMatter(dmp);
          if (dmp.isExpired(now)) darkMatterParticles.splice(i, 1);
        }
      }

      function triggerCollapse(members) {
        const L = members.length;
        for (let m = 0; m < L; m++) if (pEvent[members[m]]) return;
        for (let m = 0; m < L; m++) pEvent[members[m]] = 1;
        bangEvents.push({
          members, phase: 1, frame: 0,
          dirX: new Float32Array(L), dirY: new Float32Array(L), spd: new Float32Array(L)
        });
      }

      function startExplosion(ev, cx, cy, now) {
        const mem = ev.members, L = mem.length;
        for (let k = 0; k < L; k++) {
          const i = mem[k];
          const dx = posX[i] - cx, dy = posY[i] - cy;
          const d2 = dx * dx + dy * dy;
          const a = (d2 > 0.25 ? Math.atan2(dy, dx) : Math.random() * PI2)
                  + (Math.random() * 2 - 1) * EXPLODE_ANGLE_JITTER;
          ev.dirX[k] = Math.cos(a);
          ev.dirY[k] = Math.sin(a);
          ev.spd[k] = TYPE_BLAST_FACTOR[pType[i]] * (1 + (Math.random() * 2 - 1) * EXPLODE_JITTER);
          pEvent[i] = 2;
        }
        ev.phase = 2;
        ev.frame = 0;
        onBigBang(now);
      }

      function updateBangEvents(now) {
        for (let e = bangEvents.length - 1; e >= 0; e--) {
          const ev = bangEvents[e];
          if (ev.phase !== 1) continue;   // 噴散階段改由 updateExplosions（grid 建好之後）處理
          const mem = ev.members, L = mem.length;
          let cx = 0, cy = 0;
          for (let k = 0; k < L; k++) { cx += posX[mem[k]]; cy += posY[mem[k]]; }
          cx /= L; cy /= L;

          {
            const t = ev.frame / COLLAPSE_FRAMES;
            const G = COLLAPSE_PULL_BASE + COLLAPSE_PULL_GAIN * t * t * t;
            for (let k = 0; k < L; k++) {
              const i = mem[k];
              const g = G * TYPE_COLLAPSE_FACTOR[pType[i]];
              pullX[i] = (cx - posX[i]) * g;
              pullY[i] = (cy - posY[i]) * g;
            }
            if (++ev.frame >= COLLAPSE_FRAMES) startExplosion(ev, cx, cy, now);
          }
        }
      }

      // 噴散推力暫存（施加到「被撞的非噴散粒子」上，在積分前加進 forceX/forceY）
      let blastPushX = new Float32Array(0), blastPushY = new Float32Array(0);
      let blastPushActive = false;

      // 噴散階段：掃掠碰撞 → 偏折/減速 → 移動。需在 rebuildGrid 之後呼叫（grid 只含非噴散粒子）。
      function updateExplosions() {
        blastPushActive = false;
        for (let e = bangEvents.length - 1; e >= 0; e--) {
          const ev = bangEvents[e];
          if (ev.phase !== 2) continue;
          if (!blastPushActive) {
            if (blastPushX.length !== N) { blastPushX = new Float32Array(N); blastPushY = new Float32Array(N); }
            else { blastPushX.fill(0); blastPushY.fill(0); }
            blastPushActive = true;
          }
          const mem = ev.members, L = mem.length;
          const dirX = ev.dirX, dirY = ev.dirY, spdA = ev.spd;
          const t = ev.frame / EXPLODE_FRAMES;
          const baseSpeed = EXPLODE_SPEED * (1 - t) + EXPLODE_TAIL;
          for (let k = 0; k < L; k++) {
            const i = mem[k];
            let dx = dirX[k], dy = dirY[k], spd = spdA[k];
            const x0 = posX[i], y0 = posY[i];
            const speed = baseSpeed * spd;
            const cw = collideSweep(x0, y0, dx * speed, dy * speed, speed);
            if (cw > 0) {
              const nx = dx + BLAST_DEFLECT * sweepCX, ny = dy + BLAST_DEFLECT * sweepCY;
              const len = Math.sqrt(nx * nx + ny * ny);
              if (len > 1e-6) { dx = nx / len; dy = ny / len; } else { dx = -dx; dy = -dy; }
              spd /= 1 + BLAST_DAMP * cw;
              spdA[k] = spd;
            }
            const sp = baseSpeed * spd;
            let x = x0 + dx * sp;
            let y = y0 + dy * sp;
            if (x < 0) { x = 0; dx = -dx; }
            else if (x > CANVAS_WIDTH) { x = CANVAS_WIDTH; dx = -dx; }
            if (y < 0) { y = 0; dy = -dy; }
            else if (y > CANVAS_HEIGHT) { y = CANVAS_HEIGHT; dy = -dy; }
            posX[i] = x; posY[i] = y;
            dirX[k] = dx; dirY[k] = dy;
          }
          if (++ev.frame >= EXPLODE_FRAMES) {
            for (let k = 0; k < L; k++) {
              const i = mem[k];
              const tail = EXPLODE_TAIL * ev.spd[k];
              velX[i] = ev.dirX[k] * tail;
              velY[i] = ev.dirY[k] * tail;
              pEvent[i] = 0;
            }
            bangEvents.splice(e, 1);
          }
        }
      }

      // 線段 (x0,y0)→(x0+Dx,y0+Dy) 對 grid 內粒子的掃掠碰撞。
      // 回傳 Σw，Σ(w·法線) 放在 sweepCX/sweepCY；同時把推力累加到被撞粒子。
      // 只掃「線段外擴半徑」的包圍盒所涵蓋的格子（多數情況 1~4 格）。
      let sweepCX = 0, sweepCY = 0;
      function collideSweep(x0, y0, Dx, Dy, speed) {
        const px = posX, py = posY, cs = cellStarts, cp = cellParticles, pX = blastPushX, pY = blastPushY;
        const GW = GRID_WIDTH, GH = GRID_HEIGHT;
        const DD = Dx * Dx + Dy * Dy, invDD = DD > 0 ? 1 / DD : 0;
        const pushK = BLAST_PUSH * speed;
        const R = BLAST_COLLIDE_RADIUS;
        let lo = (((Dx < 0 ? x0 + Dx : x0) - R) / GRID_SIZE) | 0; if (lo < 0) lo = 0;
        let hi = (((Dx < 0 ? x0 : x0 + Dx) + R) / GRID_SIZE) | 0; if (hi > GW - 1) hi = GW - 1;
        let yLo = (((Dy < 0 ? y0 + Dy : y0) - R) / GRID_SIZE) | 0; if (yLo < 0) yLo = 0;
        let yHi = (((Dy < 0 ? y0 : y0 + Dy) + R) / GRID_SIZE) | 0; if (yHi > GH - 1) yHi = GH - 1;
        if (lo > hi || yLo > yHi) { sweepCX = 0; sweepCY = 0; return 0; }
        hi += 1;
        let cx = 0, cy = 0, W = 0;
        for (let ry = yLo; ry <= yHi; ry++) {
          const row = ry * GW;
          const end = cs[row + hi];
          for (let s = cs[row + lo]; s < end; s++) {   // 同列相鄰格在 cellParticles 中連續
            const j = cp[s];
            const jx = px[j], jy = py[j];
            let tt = ((jx - x0) * Dx + (jy - y0) * Dy) * invDD;
            if (tt < 0) tt = 0; else if (tt > 1) tt = 1;
            const ox = x0 + tt * Dx - jx, oy = y0 + tt * Dy - jy;   // 由 j 指向線段上最近點
            const d2 = ox * ox + oy * oy;
            if (d2 >= BLAST_COLLIDE_RADIUS_SQUARED) continue;
            let nx, ny, w;
            if (d2 > 1e-8) {
              const d = Math.sqrt(d2);
              nx = ox / d; ny = oy / d; w = 1 - d / BLAST_COLLIDE_RADIUS;
            } else {
              // 正中路徑：視為正面撞擊
              const dl = Math.sqrt(DD) || 1;
              nx = -Dx / dl; ny = -Dy / dl; w = 1;
            }
            cx += w * nx; cy += w * ny; W += w;
            const f = pushK * w;
            pX[j] -= f * nx; pY[j] -= f * ny;
          }
        }
        sweepCX = cx; sweepCY = cy;
        return W;
      }

      function markRippleParticles() {
        pInRipple.fill(0);
        for (const ripple of ripples) {
          const r = ripple.radius, r2 = r * r;
          const rx = ripple.x, ry = ripple.y;
          let xMin = ((rx - r) / GRID_SIZE) | 0; if (xMin < 0) xMin = 0;
          let xMax = ((rx + r) / GRID_SIZE) | 0; if (xMax > GRID_WIDTH - 1) xMax = GRID_WIDTH - 1;
          let yMin = ((ry - r) / GRID_SIZE) | 0; if (yMin < 0) yMin = 0;
          let yMax = ((ry + r) / GRID_SIZE) | 0; if (yMax > GRID_HEIGHT - 1) yMax = GRID_HEIGHT - 1;
          for (let cy = yMin; cy <= yMax; cy++) {
            const rowOffset = cy * GRID_WIDTH;
            for (let cx = xMin; cx <= xMax; cx++) {
              const c = rowOffset + cx;
              const end = cellStarts[c + 1];
              for (let s = cellStarts[c]; s < end; s++) {
                const i = cellParticles[s];
                const dx = posX[i] - rx;
                const dy = posY[i] - ry;
                if (dx * dx + dy * dy <= r2) pInRipple[i] = 1;
              }
            }
          }
        }
      }

      function stepPre(now) {
        prevX.set(posX); prevY.set(posY);   // 供繪製插值
        updateInteractionMatrix(now);
        updatePalette(now);
        updateBangEvents(now);
        rebuildGrid();
        updateExplosions();
        markRippleParticles();
      }
      function stepPost(now) {
        if (blastPushActive) {
          const fx = forceX, fy = forceY, bx = blastPushX, by = blastPushY;
          for (let i = 0; i < N; i++) { fx[i] += bx[i]; fy[i] += by[i]; }
        }
        integrateParticles();
        updateDarkMatter(now);
        if (now - lastClusterCheckTime >= CLUSTER_CHECK_INTERVAL) {
          applyClusters(updateClusters(), now);
        }
        emitAndAdvanceRipples(now);
      }

      function step(now) {
        stepPre(now);
        computePairForces();
        stepPost(now);
      }

      // 非同步 step：力在 worker 池中計算；完成後才推進狀態。回傳 Promise。
      function stepAsync(now) {
        if (pool.dead) { step(now); return Promise.resolve(); }
        stepPre(now);
        poolPending = computePairForcesParallel().catch(() => {
          computePairForces();   // worker 掛掉：同一份打包資料改在主執行緒算完這一步
        }).then(() => {
          poolPending = null;
          stepPost(now);
        });
        return poolPending;
      }

      function render(now, alpha) {
        const ia = 1 - alpha, px = prevX, py = prevY, cx = posX, cy = posY;
        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        for (const ripple of ripples) {
          ctx.beginPath();
          ctx.arc(ripple.x, ripple.y, ripple.radius, 0, PI2);
          ctx.strokeStyle = `rgba(20, 20, 20, ${ripple.opacity})`;
          ctx.lineWidth = 3;
          ctx.stroke();
        }
        const blink = 0.5 + 0.5 * Math.sin(PI2 * now / 1000);
        const glowA = 0.3 + 0.2 * blink;
        for (let t = 0; t < TYPES; t++) {
          const start = typeStart[t], end = typeStart[t + 1];
          let any = false;
          ctx.beginPath();
          for (let k = start; k < end; k++) {
            const i = drawOrder[k];
            if (!pClustered[i]) continue;
            ctx.rect(px[i] * ia + cx[i] * alpha - 1.5, py[i] * ia + cy[i] * alpha - 1.5, 3, 3);
            any = true;
          }
          if (any) {
            const rgb = COLOR_RGB[t];
            ctx.fillStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${glowA})`;
            ctx.fill();
          }
        }
        for (let t = 0; t < TYPES; t++) {
          const start = typeStart[t], end = typeStart[t + 1];
          ctx.beginPath();
          for (let k = start; k < end; k++) {
            const i = drawOrder[k];
            ctx.rect(px[i] * ia + cx[i] * alpha - 1, py[i] * ia + cy[i] * alpha - 1, 2, 2);
          }
          ctx.fillStyle = COLORS[t];
          ctx.fill();
        }
        for (const dmp of darkMatterParticles) {
          ctx.beginPath();
          ctx.arc(dmp.x, dmp.y, dmp.radius, 0, PI2);
          ctx.fillStyle = '#000000';
          ctx.fill();
        }
      }

      function rebuild() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
      // CPU 陣列就是本體，無需讀回；但要等進行中的非同步 step 完成
      async function snapshot() { if (poolPending) { try { await poolPending; } catch (e) {} } }

      const name = pool ? `cpu×${pool.size}` : 'cpu';
      return pool
        ? { name, triggerCollapse, step, stepAsync, render, rebuild, snapshot }
        : { name, triggerCollapse, step, render, rebuild, snapshot };
    }

    // ===================================================================
    // GPU backend（WebGPU compute + render）
    // ===================================================================
    const MAX_EVENTS = 32;
    const MAX_RIPPLES = 256;
    const MAX_DM = 64;
    const WG = 64;

    const WGSL_COMMON = /* wgsl */`
      const GRID_SIZE: f32 = ${GRID_SIZE}.0;
      const TYPES: u32 = ${TYPES}u;
      const NEARBY_R2: f32 = ${NEARBY_RADIUS_SQUARED}.0;
      const MIN_D2: f32 = ${MIN_DISTANCE_SQUARED}.0;
      const MIN_D2_RIPPLE: f32 = ${MIN_DISTANCE_RIPPLE_SQUARED}.0;
      const DM_R2: f32 = ${DARK_MATTER_RADIUS_SQUARED}.0;
      const FRICTION: f32 = ${FRICTION};
      const REPULSION: f32 = ${REPULSION_STRENGTH};
      const COINCIDENT_JITTER: f32 = ${COINCIDENT_JITTER};
      const COLLAPSE_FRAMES: u32 = ${COLLAPSE_FRAMES}u;
      const EXPLODE_FRAMES: u32 = ${EXPLODE_FRAMES}u;
      const COLLAPSE_PULL_BASE: f32 = ${COLLAPSE_PULL_BASE};
      const COLLAPSE_PULL_GAIN: f32 = ${COLLAPSE_PULL_GAIN};
      const EXPLODE_SPEED: f32 = ${EXPLODE_SPEED}.0;
      const EXPLODE_TAIL: f32 = ${EXPLODE_TAIL};
      const EXPLODE_JITTER: f32 = ${EXPLODE_JITTER};
      const EXPLODE_ANGLE_JITTER: f32 = ${EXPLODE_ANGLE_JITTER};
      const CENTROID_SCALE: f32 = 16.0;
      const BLAST_R: f32 = ${BLAST_COLLIDE_RADIUS}.0;
      const BLAST_R2: f32 = ${BLAST_COLLIDE_RADIUS_SQUARED}.0;
      const BLAST_PUSH: f32 = ${BLAST_PUSH};
      const BLAST_DEFLECT: f32 = ${BLAST_DEFLECT};
      const BLAST_DAMP: f32 = ${BLAST_DAMP};
      const PUSH_SCALE: f32 = 65536.0;   // 噴散推力定點縮放（整數 atomic → 與執行順序無關）
      const PI2: f32 = 6.283185307179586;
      const NO_CELL: u32 = 0xFFFFFFFFu;

      // 尺寸相依參數全放 uniform，resize 不需重編 shader
      struct Sim {
        n: u32, stepNo: u32, numRipples: u32, numDm: u32,
        w: f32, h: f32, gw: u32, gh: u32,
        numCells: u32, blastActive: u32, p1: u32, p2: u32
      }
      // 事件表：phase/frame 由 CPU 每步寫入（同時把累加器歸零）
      struct Ev { phase: u32, frame: u32, sumX: atomic<i32>, sumY: atomic<i32>, count: atomic<u32>, pad0: u32, pad1: u32, pad2: u32 }
      struct EvPlain { phase: u32, frame: u32, sumX: i32, sumY: i32, count: u32, pad0: u32, pad1: u32, pad2: u32 }
      // v24：依格子排序後的鄰居資料（16 bytes）。t = attr（type | inRipple<<8），i = 原粒子索引
      struct Nb { p: vec2f, t: u32, i: u32 }

      fn pcg(v: u32) -> u32 {
        let s = v * 747796405u + 2891336453u;
        let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
        return (w >> 22u) ^ w;
      }
      fn rnd(a: u32, b: u32, c: u32) -> f32 {
        return f32(pcg(pcg(pcg(a) + b) + c) >> 8u) / 16777216.0;
      }

    `;

    // pass 1：格子計數歸零（cellCount[numCells] 是「脫離 grid 粒子」計數器）
    const WGSL_CLEAR = WGSL_COMMON + /* wgsl */`
      @group(0) @binding(0) var<uniform> sim: Sim;
      @group(0) @binding(1) var<storage, read_write> cellCount: array<u32>;
      @compute @workgroup_size(${WG}) fn main(@builtin(global_invocation_id) gid: vec3u) {
        let c = gid.x;
        if (c > sim.numCells) { return; }
        cellCount[c] = 0u;
      }
    `;

    // pass 2：每粒子 atomicAdd 計數並記下自己在格內的序號。爆炸中與凍結中的粒子脫離 grid。
    const WGSL_COUNT = WGSL_COMMON + /* wgsl */`
      @group(0) @binding(0) var<uniform> sim: Sim;
      @group(0) @binding(1) var<storage, read> stateIn: array<vec4f>;
      @group(0) @binding(2) var<storage, read> pevc: array<vec2i>;
      @group(0) @binding(3) var<storage, read> events: array<EvPlain>;
      @group(0) @binding(4) var<storage, read_write> cellCount: array<atomic<u32>>;
      @group(0) @binding(5) var<storage, read_write> pcell: array<u32>;
      @group(0) @binding(6) var<storage, read_write> localSlot: array<u32>;
      @group(0) @binding(7) var<storage, read_write> push: array<i32>;
      @compute @workgroup_size(${WG}) fn main(@builtin(global_invocation_id) gid: vec3u) {
        let i = gid.x;
        if (i >= sim.n) { return; }
        if (sim.blastActive != 0u) { push[2u * i] = 0; push[2u * i + 1u] = 0; }
        let pe = pevc[i];
        var detached = (pe.x == 2);
        if (pe.x == 1) {
          detached = (events[pe.y].frame == COLLAPSE_FRAMES - 1u);
        }
        if (detached) {
          // v24：脫離 grid 的粒子也要有排序槽位（放在陣列尾端），力計算 pass 才能涵蓋全部粒子
          pcell[i] = NO_CELL;
          localSlot[i] = atomicAdd(&cellCount[sim.numCells], 1u);
          return;
        }
        let p = stateIn[i].xy;
        let gx = min(u32(p.x / GRID_SIZE), sim.gw - 1u);
        let gy = min(u32(p.y / GRID_SIZE), sim.gh - 1u);
        let c = gy * sim.gw + gx;
        pcell[i] = c;
        localSlot[i] = atomicAdd(&cellCount[c], 1u);
      }
    `;

    // pass 3：前綴和（格子數只有數百到一兩千，單執行緒序列即可）
    const WGSL_SCAN = WGSL_COMMON + /* wgsl */`
      @group(0) @binding(0) var<uniform> sim: Sim;
      @group(0) @binding(1) var<storage, read> cellCount: array<u32>;
      @group(0) @binding(2) var<storage, read_write> cellStart: array<u32>;
      @compute @workgroup_size(1) fn main() {
        var acc = 0u;
        cellStart[0] = 0u;
        for (var c = 0u; c < sim.numCells; c++) {
          acc += cellCount[c];
          cellStart[c + 1u] = acc;
        }
      }
    `;

    // pass 5（v24 移到 flags 之後）：散佈成「依格子排序」的連續鄰居資料。
    // grid 內的粒子放 [0, cellStart[numCells])，脫離 grid 的放尾端 → 0..n-1 每個槽位恰好一個粒子。
    const WGSL_SCATTER = WGSL_COMMON + /* wgsl */`
      @group(0) @binding(0) var<uniform> sim: Sim;
      @group(0) @binding(1) var<storage, read> pcell: array<u32>;
      @group(0) @binding(2) var<storage, read> localSlot: array<u32>;
      @group(0) @binding(3) var<storage, read> cellStart: array<u32>;
      @group(0) @binding(4) var<storage, read> stateIn: array<vec4f>;
      @group(0) @binding(5) var<storage, read> attr: array<u32>;
      @group(0) @binding(6) var<storage, read_write> sorted: array<Nb>;
      @compute @workgroup_size(${WG}) fn main(@builtin(global_invocation_id) gid: vec3u) {
        let i = gid.x;
        if (i >= sim.n) { return; }
        let c = pcell[i];
        var k: u32;
        if (c == NO_CELL) { k = sim.n - 1u - localSlot[i]; }
        else { k = cellStart[c] + localSlot[i]; }
        sorted[k] = Nb(stateIn[i].xy, attr[i], i);
      }
    `;

    // pass 4：漣漪旗標。attr 低 8 位 = type（靜態），bit 8 = inRipple
    const WGSL_FLAGS = WGSL_COMMON + /* wgsl */`
      @group(0) @binding(0) var<uniform> sim: Sim;
      @group(0) @binding(1) var<storage, read> stateIn: array<vec4f>;
      @group(0) @binding(2) var<uniform> ripples: array<vec4f, ${MAX_RIPPLES}>;   // x, y, r2, -
      @group(0) @binding(3) var<storage, read_write> attr: array<u32>;
      @compute @workgroup_size(${WG}) fn main(@builtin(global_invocation_id) gid: vec3u) {
        let i = gid.x;
        if (i >= sim.n) { return; }
        let p = stateIn[i].xy;
        var inR = 0u;
        for (var k = 0u; k < sim.numRipples; k++) {
          let r = ripples[k];
          let d = p - r.xy;
          if (dot(d, d) <= r.z) { inR = 1u; break; }
        }
        attr[i] = (attr[i] & 0xFFu) | (inR << 8u);
      }
    `;

    // pass 6：事件質心（定點整數 atomic，與順序無關 → 確定性）
    const WGSL_REDUCE = WGSL_COMMON + /* wgsl */`
      @group(0) @binding(0) var<uniform> sim: Sim;
      @group(0) @binding(1) var<storage, read> stateIn: array<vec4f>;
      @group(0) @binding(2) var<storage, read> pevc: array<vec2i>;
      @group(0) @binding(3) var<storage, read_write> events: array<Ev>;
      @compute @workgroup_size(${WG}) fn main(@builtin(global_invocation_id) gid: vec3u) {
        let i = gid.x;
        if (i >= sim.n) { return; }
        let pe = pevc[i];
        if (pe.x == 0) { return; }
        let p = stateIn[i].xy;
        atomicAdd(&events[pe.y].sumX, i32(round(p.x * CENTROID_SCALE)));
        atomicAdd(&events[pe.y].sumY, i32(round(p.y * CENTROID_SCALE)));
        atomicAdd(&events[pe.y].count, 1u);
      }
    `;

    // pass 6.5（v24.1）：噴散碰撞。只在有噴散事件時派發。
    // 噴散粒子位於排序陣列尾端 [cellStart[numCells], n)；grid 內只有非噴散粒子 → 噴散粒子彼此不碰撞。
    // 每個噴散粒子以「這一步的移動線段」掃描 3×3 格：累計自己的偏折/減速，並用整數 atomic 把推力加到被撞粒子。
    const WGSL_BLAST = WGSL_COMMON + /* wgsl */`
      @group(0) @binding(0) var<uniform> sim: Sim;
      @group(0) @binding(1) var<storage, read> sorted: array<Nb>;
      @group(0) @binding(2) var<storage, read> cellStart: array<u32>;
      @group(0) @binding(3) var<storage, read> pevc: array<vec2i>;
      @group(0) @binding(4) var<storage, read_write> pevg: array<vec4f>;
      @group(0) @binding(5) var<storage, read> events: array<EvPlain>;
      @group(0) @binding(6) var<storage, read_write> push: array<atomic<i32>>;
      @group(0) @binding(7) var<uniform> consts: array<vec4f, 42>;

      fn blastFactor(t: u32) -> f32 { return consts[39u + (t >> 2u)][t & 3u]; }

      @compute @workgroup_size(${WG}) fn main(@builtin(global_invocation_id) gid: vec3u) {
        let k = gid.x;
        if (k >= sim.n || k < cellStart[sim.numCells]) { return; }
        let me = sorted[k];
        let i = me.i;
        let pe = pevc[i];
        if (pe.x != 2) { return; }
        let ev = events[pe.y];
        let frame = ev.frame;
        let p = me.p;
        var g = pevg[i];
        if (frame == 0u) {
          // 噴散第一步：決定方向與速度係數（原本在力 pass 內）
          let c = vec2f(f32(ev.sumX), f32(ev.sumY)) / (CENTROID_SCALE * f32(max(ev.count, 1u)));
          let d = p - c;
          var ang: f32;
          if (dot(d, d) > 0.25) { ang = atan2(d.y, d.x); } else { ang = rnd(i, sim.stepNo, 11u) * PI2; }
          ang += (rnd(i, sim.stepNo, 12u) * 2.0 - 1.0) * EXPLODE_ANGLE_JITTER;
          g = vec4f(cos(ang), sin(ang), blastFactor(me.t & 0xFFu) * (1.0 + (rnd(i, sim.stepNo, 13u) * 2.0 - 1.0) * EXPLODE_JITTER), 0.0);
        }
        let t = f32(frame) / f32(EXPLODE_FRAMES);
        let speed = (EXPLODE_SPEED * (1.0 - t) + EXPLODE_TAIL) * g.z;
        let D = g.xy * speed;
        let DD = dot(D, D);
        let invDD = select(0.0, 1.0 / DD, DD > 0.0);
        let pushK = BLAST_PUSH * speed;

        // 只掃「線段外擴半徑」的包圍盒所涵蓋的格子
        let bmin = (min(p, p + D) - vec2f(BLAST_R)) / GRID_SIZE;
        let bmax = (max(p, p + D) + vec2f(BLAST_R)) / GRID_SIZE;
        let cx0 = u32(clamp(i32(floor(bmin.x)), 0, i32(sim.gw) - 1));
        let cx1 = u32(clamp(i32(floor(bmax.x)), 0, i32(sim.gw) - 1)) + 1u;
        let cy0 = clamp(i32(floor(bmin.y)), 0, i32(sim.gh) - 1);
        let cy1 = clamp(i32(floor(bmax.y)), 0, i32(sim.gh) - 1);
        var C = vec2f(0.0, 0.0);
        var W = 0.0;
        for (var cy = cy0; cy <= cy1; cy++) {
          let row = u32(cy) * sim.gw;
          let s1 = cellStart[row + cx1];
          for (var s = cellStart[row + cx0]; s < s1; s++) {
            let nb = sorted[s];
            let tt = clamp(dot(nb.p - p, D) * invDD, 0.0, 1.0);
            let o = p + D * tt - nb.p;        // 由 j 指向線段上最近點
            let d2 = dot(o, o);
            if (d2 >= BLAST_R2) { continue; }
            var n: vec2f;
            var w: f32;
            if (d2 > 1e-8) {
              let dd = sqrt(d2);
              n = o / dd; w = 1.0 - dd / BLAST_R;
            } else {
              n = -g.xy; w = 1.0;              // 正中路徑：正面撞擊
            }
            C += w * n; W += w;
            let pv = n * (-pushK * w * PUSH_SCALE);
            atomicAdd(&push[2u * nb.i], i32(round(pv.x)));
            atomicAdd(&push[2u * nb.i + 1u], i32(round(pv.y)));
          }
        }
        if (W > 0.0) {
          let nd = g.xy + BLAST_DEFLECT * C;
          let L = length(nd);
          if (L > 1e-6) { g = vec4f(nd / L, g.z, g.w); } else { g = vec4f(-g.xy, g.z, g.w); }
          g.z = g.z / (1.0 + BLAST_DAMP * W);
        }
        pevg[i] = g;
      }
    `;

    // pass 7：力 + 積分（gather ±2 格），坍縮拉力、暗物質推力、爆炸位移全在此
    const WGSL_FORCE = WGSL_COMMON + /* wgsl */`
      @group(0) @binding(0) var<uniform> sim: Sim;
      @group(0) @binding(1) var<storage, read> stateIn: array<vec4f>;
      @group(0) @binding(2) var<storage, read_write> stateOut: array<vec4f>;
      @group(0) @binding(3) var<storage, read> pevc: array<vec2i>;       // x=state y=eventId
      @group(0) @binding(4) var<storage, read_write> pevg: array<vec4f>; // dir.xy, spd, -
      @group(0) @binding(5) var<storage, read> sorted: array<Nb>;        // v24：依格子排序的鄰居資料
      @group(0) @binding(6) var<storage, read> cellStart: array<u32>;
      @group(0) @binding(7) var<storage, read_write> events: array<Ev>;
      // consts[0..35] = 12x12 矩陣，[36..38] = collapse factor，[39..41] = blast factor
      @group(0) @binding(8) var<uniform> consts: array<vec4f, 42>;
      @group(0) @binding(9) var<uniform> dm: array<vec4f, ${MAX_DM}>;  // x, y, repulsion, -
      @group(0) @binding(10) var<storage, read> push: array<i32>;       // v24.1：噴散推力（定點）

      fn matrixAt(k: u32) -> f32 { return consts[k >> 2u][k & 3u]; }
      fn collapseFactor(t: u32) -> f32 { return consts[36u + (t >> 2u)][t & 3u]; }
      fn blastFactor(t: u32) -> f32 { return consts[39u + (t >> 2u)][t & 3u]; }

      fn centroidOf(e: i32) -> vec2f {
        let cnt = max(atomicLoad(&events[e].count), 1u);
        let sx = f32(atomicLoad(&events[e].sumX));
        let sy = f32(atomicLoad(&events[e].sumY));
        return vec2f(sx, sy) / (CENTROID_SCALE * f32(cnt));
      }

      // v24：執行緒 k 處理「排序後第 k 個」粒子 → 同一 workgroup 的執行緒是空間上相鄰的粒子，
      // 鄰居清單幾乎相同：讀取合併（coalesced）、快取命中高、迴圈次數一致（少 divergence）。
      @compute @workgroup_size(${WG}) fn main(@builtin(global_invocation_id) gid: vec3u) {
        let k = gid.x;
        if (k >= sim.n) { return; }
        let me = sorted[k];
        let i = me.i;
        let st = stateIn[i];
        var p = st.xy;
        var v = st.zw;
        let pe = pevc[i];
        let evs = pe.x;
        let eid = pe.y;
        let a = me.t;
        let ti = a & 0xFFu;

        // ---- 爆炸中：脫離物理 ----
        if (evs == 2) {
          let frame = events[eid].frame;
          var g = pevg[i];   // 方向/速度係數已由噴散碰撞 pass 初始化並更新
          let t = f32(frame) / f32(EXPLODE_FRAMES);
          let speed = (EXPLODE_SPEED * (1.0 - t) + EXPLODE_TAIL) * g.z;
          p += g.xy * speed;
          if (p.x < 0.0) { p.x = 0.0; g.x = -g.x; } else if (p.x > sim.w) { p.x = sim.w; g.x = -g.x; }
          if (p.y < 0.0) { p.y = 0.0; g.y = -g.y; } else if (p.y > sim.h) { p.y = sim.h; g.y = -g.y; }
          if (frame == EXPLODE_FRAMES - 1u) { v = g.xy * (EXPLODE_TAIL * g.z); }
          pevg[i] = g;
          stateOut[i] = vec4f(p, v);
          return;
        }

        // ---- 坍縮最後一步：凍結（對應 v21 該步 pEvent 已設為 2、跳過積分）----
        var frame = 0u;
        if (evs == 1) {
          frame = events[eid].frame;
          if (frame == COLLAPSE_FRAMES - 1u) { stateOut[i] = st; return; }
        }

        // ---- 配對力 ----
        let ri = (a >> 8u) & 1u;
        let minD2i = select(MIN_D2, MIN_D2_RIPPLE, ri == 1u);
        let minDi = select(7.0, 3.0, ri == 1u);
        let rowI = ti * TYPES;
        var f = vec2f(0.0, 0.0);

        let gx = i32(min(u32(p.x / GRID_SIZE), sim.gw - 1u));
        let gy = i32(min(u32(p.y / GRID_SIZE), sim.gh - 1u));
        // grid 是 row-major：同一列 cx-2..cx+2 五格在排序陣列中是一段連續區間 → 每列一個迴圈
        let cx0 = u32(max(gx - 2, 0));
        let cx1 = u32(min(gx + 2, i32(sim.gw) - 1)) + 1u;
        for (var dy = -2; dy <= 2; dy++) {
          let cy = gy + dy;
          if (cy < 0 || cy >= i32(sim.gh)) { continue; }
          let row = u32(cy) * sim.gw;
          let s0 = cellStart[row + cx0];
          let s1 = cellStart[row + cx1];
          for (var s = s0; s < s1; s++) {
            let nb = sorted[s];
            let j = nb.i;
            if (j == i) { continue; }
            let d = nb.p - p;      // 由 i 指向 j
            let d2 = dot(d, d);
            if (d2 >= NEARBY_R2) { continue; }
            if (d2 == 0.0) {
              // 完全重合：兩邊由同一 seed 得到同一角度、取反號 → 對稱分離
              let ang = rnd(min(i, j), max(i, j), sim.stepNo) * PI2;
              let jv = vec2f(cos(ang), sin(ang)) * COINCIDENT_JITTER;
              f += select(-jv, jv, i < j);
              continue;
            }
            let mult = select(select(10.0, 20.0, d2 < 2500.0), -2.0, d2 < 400.0) / d2;
            if (d2 < minD2i) {
              let dist = sqrt(d2);
              let sr = REPULSION * (1.0 - dist / minDi) / dist;
              f -= sr * d;
            } else {
              let tj = nb.t & 0xFFu;
              f += matrixAt(rowI + tj) * mult * d;
            }
          }
        }

        // ---- 噴散粒子的撞擊推力 ----
        if (sim.blastActive != 0u) {
          f += vec2f(f32(push[2u * i]), f32(push[2u * i + 1u])) / PUSH_SCALE;
        }

        // ---- 坍縮拉力 ----
        if (evs == 1) {
          let t = f32(frame) / f32(COLLAPSE_FRAMES);
          let G = COLLAPSE_PULL_BASE + COLLAPSE_PULL_GAIN * t * t * t;
          let c = centroidOf(eid);
          f += (c - p) * (G * collapseFactor(ti));
        }

        // ---- 暗物質推力（作用在速度上）----
        for (var k = 0u; k < sim.numDm; k++) {
          let m = dm[k];
          let d = p - m.xy;
          let d2 = dot(d, d);
          if (d2 < DM_R2 && d2 > 0.01) {
            v += (m.z / sqrt(d2)) * d;
          }
        }

        // ---- 積分與邊界 ----
        v = (v + f) * FRICTION;
        p += v;
        if (p.x < 0.0) { p.x = 0.0; v.x = select(abs(v.x), 0.5, abs(v.x) < 0.5); }
        else if (p.x > sim.w) { p.x = sim.w; v.x = select(-abs(v.x), -0.5, abs(v.x) < 0.5); }
        if (p.y < 0.0) { p.y = 0.0; v.y = select(abs(v.y), 0.5, abs(v.y) < 0.5); }
        else if (p.y > sim.h) { p.y = sim.h; v.y = select(-abs(v.y), -0.5, abs(v.y) < 0.5); }
        if (p.x < 5.0) { v.x += 5.0; } else if (p.x > sim.w - 5.0) { v.x -= 5.0; }
        if (p.y < 5.0) { v.y += 5.0; } else if (p.y > sim.h - 5.0) { v.y -= 5.0; }

        stateOut[i] = vec4f(p, v);
      }
    `;

    // 繪製：漣漪 → 光暈 → 粒子 → 暗物質，全部 instanced quad
    const WGSL_RENDER = WGSL_COMMON + /* wgsl */`
      struct RParams { w: f32, h: f32, glowAlpha: f32, alpha: f32 }   // alpha = 插值係數
      @group(0) @binding(0) var<uniform> rp: RParams;
      @group(0) @binding(1) var<storage, read> state: array<vec4f>;
      @group(0) @binding(2) var<storage, read> drawOrder: array<u32>;
      @group(0) @binding(3) var<storage, read> attr: array<u32>;
      @group(0) @binding(4) var<storage, read> clustered: array<u32>;
      @group(0) @binding(5) var<uniform> colors: array<vec4f, ${TYPES}>;
      @group(0) @binding(6) var<uniform> ripples: array<vec4f, ${MAX_RIPPLES}>;  // x, y, radius, opacity
      @group(0) @binding(7) var<uniform> dm: array<vec4f, ${MAX_DM}>;
      @group(0) @binding(8) var<storage, read> prevState: array<vec4f>;   // v24：上一步，用於插值

      fn posOf(i: u32) -> vec2f { return mix(prevState[i].xy, state[i].xy, rp.alpha); }

      struct VOut { @builtin(position) pos: vec4f, @location(0) color: vec4f, @location(1) local: vec2f, @location(2) radius: f32 }

      fn corner(vi: u32) -> vec2f {
        let x = select(-1.0, 1.0, vi == 1u || vi == 3u || vi == 4u);
        let y = select(-1.0, 1.0, vi == 2u || vi == 4u || vi == 5u);
        return vec2f(x, y);
      }
      fn toClip(px: vec2f) -> vec4f {
        return vec4f(px.x / rp.w * 2.0 - 1.0, 1.0 - px.y / rp.h * 2.0, 0.0, 1.0);
      }
      const OFFSCREEN = vec4f(2.0, 2.0, 0.0, 1.0);

      @vertex fn vsParticle(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VOut {
        var o: VOut;
        let i = drawOrder[ii];
        let p = posOf(i) + corner(vi) * 1.0;   // 2x2 方塊
        o.pos = toClip(p);
        o.color = vec4f(colors[attr[i] & 0xFFu].rgb, 1.0);
        o.local = vec2f(0.0); o.radius = 0.0;
        return o;
      }
      @vertex fn vsGlow(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VOut {
        var o: VOut;
        let i = drawOrder[ii];
        if (clustered[i] == 0u) { o.pos = OFFSCREEN; o.color = vec4f(0.0); o.local = vec2f(0.0); o.radius = 0.0; return o; }
        let p = posOf(i) + corner(vi) * 1.5;   // 3x3 方塊
        o.pos = toClip(p);
        o.color = vec4f(colors[attr[i] & 0xFFu].rgb, rp.glowAlpha);
        o.local = vec2f(0.0); o.radius = 0.0;
        return o;
      }
      @fragment fn fsFlat(fin: VOut) -> @location(0) vec4f { return fin.color; }

      @vertex fn vsRipple(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VOut {
        var o: VOut;
        let r = ripples[ii];
        let hs = r.z + 2.5;
        let c = corner(vi);
        o.pos = toClip(r.xy + c * hs);
        o.local = c * hs;
        o.radius = r.z;
        o.color = vec4f(20.0 / 255.0, 20.0 / 255.0, 20.0 / 255.0, r.w);
        return o;
      }
      @fragment fn fsRipple(fin: VOut) -> @location(0) vec4f {
        // 線寬 3（±1.5），邊緣 1px 抗鋸齒
        let d = abs(length(fin.local) - fin.radius);
        let a = 1.0 - smoothstep(1.0, 2.0, d);
        return vec4f(fin.color.rgb, fin.color.a * a);
      }

      @vertex fn vsDm(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VOut {
        var o: VOut;
        let m = dm[ii];
        let hs = 3.0;
        let c = corner(vi);
        o.pos = toClip(m.xy + c * hs);
        o.local = c * hs;
        o.radius = 2.0;
        o.color = vec4f(0.0, 0.0, 0.0, 1.0);
        return o;
      }
      @fragment fn fsDm(fin: VOut) -> @location(0) vec4f {
        let a = 1.0 - smoothstep(fin.radius - 0.5, fin.radius + 0.5, length(fin.local));
        return vec4f(0.0, 0.0, 0.0, a);
      }
    `;

    async function createGpuBackend() {
      if (!navigator.gpu) throw new Error('navigator.gpu 不存在');
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) throw new Error('requestAdapter 失敗');
      const device = await adapter.requestDevice();
      device.lost.then(info => console.error('WebGPU device lost:', info.message));
      device.addEventListener('uncapturederror', e => console.error('WebGPU error:', e.error.message));
      device.pushErrorScope('validation');   // 建立階段任何驗證錯誤都要能退回 CPU
      const gctx = canvas.getContext('webgpu');
      const format = navigator.gpu.getPreferredCanvasFormat();
      gctx.configure({ device, format, alphaMode: 'opaque' });

      const B = GPUBufferUsage;
      const mkBuf = (size, usage) => device.createBuffer({ size: Math.max(16, size), usage });

      // ---- 與尺寸無關的 buffer（只建一次）----
      const eventsBuf = mkBuf(MAX_EVENTS * 32, B.STORAGE | B.COPY_DST);
      const eventsCpu = new Uint32Array(MAX_EVENTS * 8);
      const simBuf = mkBuf(48, B.UNIFORM | B.COPY_DST);
      const simRaw = new ArrayBuffer(48);
      const simU32 = new Uint32Array(simRaw);
      const simF32 = new Float32Array(simRaw);
      const constsBuf = mkBuf(42 * 16, B.UNIFORM | B.COPY_DST);
      const constsCpu = new Float32Array(42 * 4);
      for (let t = 0; t < TYPES; t++) {
        constsCpu[144 + t] = TYPE_COLLAPSE_FACTOR[t];
        constsCpu[156 + t] = TYPE_BLAST_FACTOR[t];
      }
      const ripplesSimBuf = mkBuf(MAX_RIPPLES * 16, B.UNIFORM | B.COPY_DST);
      const ripplesRenderBuf = mkBuf(MAX_RIPPLES * 16, B.UNIFORM | B.COPY_DST);
      const ripplesCpu = new Float32Array(MAX_RIPPLES * 4);
      const dmBuf = mkBuf(MAX_DM * 16, B.UNIFORM | B.COPY_DST);
      const dmCpu = new Float32Array(MAX_DM * 4);
      const colorsBuf = mkBuf(TYPES * 16, B.UNIFORM | B.COPY_DST);
      const colorsCpu = new Float32Array(TYPES * 4);
      const rpBuf = mkBuf(16, B.UNIFORM | B.COPY_DST);
      const rpCpu = new Float32Array([0, 0, 0.3, 0]);

      // ---- pipelines（只建一次；尺寸全走 uniform）----
      const mkCompute = (code, label) => device.createComputePipelineAsync({
        label, layout: 'auto',
        compute: { module: device.createShaderModule({ code, label }), entryPoint: 'main' }
      });
      const [pClear, pCount, pScan, pScatter, pFlags, pReduce, pBlast, pForce] = await Promise.all([
        mkCompute(WGSL_CLEAR, 'clear'), mkCompute(WGSL_COUNT, 'count'), mkCompute(WGSL_SCAN, 'scan'),
        mkCompute(WGSL_SCATTER, 'scatter'), mkCompute(WGSL_FLAGS, 'flags'), mkCompute(WGSL_REDUCE, 'reduce'),
        mkCompute(WGSL_BLAST, 'blast'), mkCompute(WGSL_FORCE, 'force')
      ]);

      const renderModule = device.createShaderModule({ code: WGSL_RENDER, label: 'render' });
      const V = GPUShaderStage.VERTEX, F = GPUShaderStage.FRAGMENT;
      const renderBGL = device.createBindGroupLayout({
        entries: [
          { binding: 0, visibility: V | F, buffer: { type: 'uniform' } },
          { binding: 1, visibility: V, buffer: { type: 'read-only-storage' } },
          { binding: 2, visibility: V, buffer: { type: 'read-only-storage' } },
          { binding: 3, visibility: V, buffer: { type: 'read-only-storage' } },
          { binding: 4, visibility: V, buffer: { type: 'read-only-storage' } },
          { binding: 5, visibility: V, buffer: { type: 'uniform' } },
          { binding: 6, visibility: V, buffer: { type: 'uniform' } },
          { binding: 7, visibility: V, buffer: { type: 'uniform' } },
          { binding: 8, visibility: V, buffer: { type: 'read-only-storage' } },

        color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
        alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' }
      };

        layout: renderLayout,
        vertex: { module: renderModule, entryPoint: vs },
        fragment: { module: renderModule, entryPoint: fs, targets: [{ format, blend }] },
        primitive: { topology: 'triangle-list' },
        multisample: { count: SAMPLES }
      });

        mkRender('vsRipple', 'fsRipple'), mkRender('vsGlow', 'fsFlat'),

      // ---- 尺寸相依資源（rebuild 時重建）----
      const R = {};   // stateBuf, attrBuf, drawOrderBuf, clusteredBuf, pevcBuf, pevgBuf, grid buffers, staging, msaa, bind groups
      let clusteredU32 = null;
      let pevcCpu = null;
      let groups = 0;

      // ---- 狀態 ----
      let parity = 0;
      let stepCounter = 0;
      let pevcDirty = false;
      const eventSlots = new Array(MAX_EVENTS).fill(null);
      let readbackPromise = null;
      let lastReadbackRequest = -Infinity;

        layout: pipeline.getBindGroupLayout(0),

      function rebuild() {

          const v = R[k];

        ];

        device.queue.writeBuffer(R.stateBuf[1], 0, stateInit);

        const attrInit = new Uint32Array(N);
        for (let i = 0; i < N; i++) attrInit[i] = pType[i];
        R.attrBuf = mkBuf(N * 4, B.STORAGE | B.COPY_DST);
        device.queue.writeBuffer(R.attrBuf, 0, attrInit);

        R.drawOrderBuf = mkBuf(N * 4, B.STORAGE | B.COPY_DST);
        device.queue.writeBuffer(R.drawOrderBuf, 0, new Uint32Array(drawOrder));

        R.clusteredBuf = mkBuf(N * 4, B.STORAGE | B.COPY_DST);
        clusteredU32 = new Uint32Array(N);

        pevcCpu = new Int32Array(N * 2);
        for (let i = 0; i < N; i++) pevcCpu[i * 2 + 1] = -1;
